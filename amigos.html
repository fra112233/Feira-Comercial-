<!DOCTYPE html>
<html lang="pt-pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amigos | Feira Comercial</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
:root{ --brand:#2563eb; --pro:#7c3aed; --bg:#0f172a; --surface:#1e293b; --hover:#334155;
  --text:#f8fafc; --sub:#94a3b8; --border:rgba(255,255,255,.1); --ok:#22c55e; --danger:#ef4444; --radius:16px; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}

/* TOPBAR — com identidade do utilizador (foto + nome) */
.topbar{position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:12px;
  padding:12px 20px;background:rgba(15,23,42,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar .logo{font-weight:800;color:#f0ec0f}
.me-chip{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);
  padding:4px 12px 4px 4px;border-radius:30px;border:1px solid var(--border);cursor:pointer}
.me-chip img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--hover)}
.me-chip span{font-size:13px;font-weight:700;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
.icon-btn:hover{background:var(--hover)}

.main{max-width:1100px;margin:0 auto;padding:26px 20px 110px}

/* PRO CARD */
.pro-card{background:linear-gradient(135deg,#1e293b,#334155);border:1px solid var(--pro);
  padding:18px 22px;border-radius:var(--radius);display:flex;justify-content:space-between;
  align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.pro-card h3{font-weight:800}
.pro-card p{color:var(--sub);font-size:13px}
#togglePro{padding:10px 22px;border-radius:10px;border:none;background:var(--pro);color:#fff;font-weight:800;cursor:pointer}

/* SEARCH + FILTERS */
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:30px;padding:10px 16px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px}
.search i{color:var(--sub)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 18px;background:var(--surface);border:1px solid var(--border);
  border-radius:100px;color:var(--sub);font-size:13px;cursor:pointer;transition:.2s}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip:hover{border-color:var(--brand)}

/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tab{flex:1;padding:11px;border:none;background:var(--surface);color:var(--sub);font-weight:700;
  font-size:13px;border-radius:10px;cursor:pointer;border:1px solid var(--border)}
.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.tab .badge{background:#fff;color:var(--brand);border-radius:20px;padding:1px 8px;font-size:11px;margin-left:6px}
.tab:not(.active) .badge{background:var(--danger);color:#fff}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;transition:.25s;position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--brand)}
.card-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.card-top img{width:54px;height:54px;border-radius:14px;object-fit:cover;background:var(--hover)}
.card-top .nm{font-weight:800;font-size:15px}
.card-top .cl{font-size:11px;color:var(--sub)}
.type-tag{font-size:10px;padding:2px 8px;border-radius:20px;margin-left:6px}
.type-empresa{background:rgba(124,58,237,.2);color:#c4b5fd}
.type-singular{background:rgba(37,99,235,.2);color:#93c5fd}
.bio{font-size:13px;color:var(--sub);margin-bottom:16px;min-height:34px}
.btn-full{width:100%;padding:12px;border:none;border-radius:10px;background:var(--brand);color:#fff;
  font-weight:800;cursor:pointer;transition:.2s;font-size:13px}
.btn-full.pro{background:var(--pro)}
.btn-full:hover{filter:brightness(1.15)}
.btn-full:disabled{background:var(--hover);color:var(--sub);cursor:default}
.btn-row{display:flex;gap:8px}
.btn-row .btn-full{flex:1}
.accept{background:var(--ok)} .decline{background:var(--hover);color:var(--sub)}

.empty{text-align:center;padding:50px 20px;color:var(--sub);grid-column:1/-1}
.empty i{font-size:44px;opacity:.35;display:block;margin-bottom:12px}
.skel{height:180px;border-radius:var(--radius);background:var(--surface);animation:pu 1.4s infinite}
@keyframes pu{0%,100%{opacity:.5}50%{opacity:1}}

#toast{position:fixed;bottom:28px;right:28px;background:var(--brand);color:#fff;padding:14px 24px;
  border-radius:12px;display:none;z-index:9999;font-weight:700;animation:sl .3s}
@keyframes sl{from{transform:translateX(100px);opacity:0}to{transform:none;opacity:1}}

/* BOTTOM NAV MOBILE */
.bottom-nav{display:none}
@media(max-width:760px){
  .main{padding:16px 14px 110px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;z-index:1000;
    background:rgba(15,23,42,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);
    justify-content:space-around;align-items:center}
  .bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--sub)}
  .bottom-nav a.active{color:var(--brand)}
  .bottom-nav i{font-size:19px}
  .topbar .logo{font-size:16px}
}
</style>
<base target="_blank">
</head>
<body>

<header class="topbar">
  <a class="logo" href="index.html"><i class="fas fa-bolt"></i> Feira Comercial</a>
  <a class="icon-btn" href="index.html" title="Início"><i class="fas fa-home"></i></a>
  <a class="icon-btn" href="mensagen.html" title="Mensagens"><i class="fas fa-comment-dots"></i></a>
  <a class="me-chip" href="perfil.html">
    <img data-fc-avatar src="" alt="">
    <span data-fc-name>…</span>
  </a>
</header>

<main class="main">
  <div class="pro-card">
    <div>
      <h3><i class="fas fa-briefcase" style="color:#c4b5fd"></i> Modo Profissional</h3>
      <p>Alterne para o modo de seguidores e convites diretos.</p>
    </div>
    <button id="togglePro" onclick="togglePro()">ATIVAR</button>
  </div>

  <div class="toolbar">
    <div class="search">
      <i class="fas fa-search"></i>
      <input id="searchInput" placeholder="Pesquisar pessoas ou empresas..." oninput="render()">
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-sug" onclick="setTab('sugestoes',this)">✨ Sugestões</button>
    <button class="tab" id="tab-ped" onclick="setTab('pedidos',this)">📨 Pedidos <span class="badge" id="reqBadge" style="display:none">0</span></button>
    <button class="tab" id="tab-ami" onclick="setTab('amigos',this)">👥 Amigos <span class="badge" id="frBadge" style="display:none">0</span></button>
  </div>

  <div class="chips" id="chips">
    <div class="chip active" data-f="" onclick="setFilter('',this)">Todos</div>
    <div class="chip" data-f="tecnologia" onclick="setFilter('tecnologia',this)">💻 Tecnologia</div>
    <div class="chip" data-f="educacao" onclick="setFilter('educacao',this)">🎓 Educação</div>
    <div class="chip" data-f="varejo" onclick="setFilter('varejo',this)">🛍️ Varejo</div>
    <div class="chip" data-f="saude" onclick="setFilter('saude',this)">🩺 Saúde</div>
    <div class="chip" data-f="construcao" onclick="setFilter('construcao',this)">🏗️ Construção</div>
    <div class="chip" data-f="empresa" onclick="setFilter('empresa',this)">🏢 Empresas</div>
  </div>

  <div class="grid" id="grid">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html"><i class="fas fa-home"></i>Início</a>
  <a href="amigos.html" class="active"><i class="fas fa-user-friends"></i>Amigos</a>
  <a href="mensagen.html"><i class="fas fa-comment-dots"></i>Mensagens</a>
  <a href="perfil.html"><i class="fas fa-user"></i>Perfil</a>
</nav>

<div id="toast"></div>

<script>
let me = null;
let allUsers = [];
let friends = [];      // ids dos meus amigos
let sentTo = [];       // ids para quem já enviei pedido
let incoming = [];     // pedidos recebidos {id, from_id, profiles}
let currentTab = 'sugestoes';
let filter = '';
let isPro = false;

(async function init(){
  me = await FC.boot();
  if (!me) return;
  await loadAll();
})();

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2600);
}

function avatarOf(u){
  return u.avatar_url || ('https://ui-avatars.com/api/?name=' + encodeURIComponent(u.full_name || 'U') +
    '&background=random&color=fff&size=128');
}
function sectorLabel(s){
  return ({tecnologia:'💻 Tecnologia', educacao:'🎓 Educação', varejo:'🛍️ Varejo',
    saude:'🩺 Saúde', construcao:'🏗️ Construção', outro:'Outros'})[s] || '';
}
function esc(s){ return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadAll(){
  // todos os perfis públicos (exceto eu)
  const { data: users } = await supabaseClient
    .from('profiles')
    .select('id, full_name, type, sector, bio, morada, avatar_url, created_at')
    .neq('id', me.id)
    .eq('visibility', 'publico')
    .order('created_at', { ascending: false })
    .limit(100);
  allUsers = users || [];

  // amizades aceites
  const { data: f1 } = await supabaseClient.from('friendships').select('friend_id').eq('user_id', me.id);
  const { data: f2 } = await supabaseClient.from('friendships').select('user_id').eq('friend_id', me.id);
  friends = [...(f1||[]).map(r => r.friend_id), ...(f2||[]).map(r => r.user_id)];

  // pedidos enviados por mim (pendentes)
  const { data: sent } = await supabaseClient
    .from('friend_requests').select('to_id').eq('from_id', me.id).eq('status', 'pendente');
  sentTo = (sent||[]).map(r => r.to_id);

  // pedidos recebidos
  const { data: reqs } = await supabaseClient
    .from('friend_requests')
    .select('id, from_id, created_at, profiles!friend_requests_from_id_fkey(full_name, avatar_url, sector, type, bio)')
    .eq('to_id', me.id).eq('status', 'pendente');
  incoming = (reqs || []).map(r => ({ ...r, user: Array.isArray(r.profiles) ? r.profiles[0] : r.profiles }));

  const badge = document.getElementById('reqBadge');
  if (incoming.length){ badge.textContent = incoming.length; badge.style.display = ''; }
  const fb = document.getElementById('frBadge');
  if (friends.length){ fb.textContent = friends.length; fb.style.display = ''; }

  render();
}

function togglePro(){
  isPro = !isPro;
  const btn = document.getElementById('togglePro');
  btn.textContent = isPro ? 'DESATIVAR' : 'ATIVAR';
  btn.style.background = isPro ? '#ef4444' : 'var(--pro)';
  toast(isPro ? 'Modo Profissional ativo' : 'Modo Pessoal ativo');
  render();
}

function setTab(tab, btn){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setFilter(f, el){
  filter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  render();
}

function card(u, mode, extra){
  const tag = u.type === 'empresa'
    ? '<span class="type-tag type-empresa">🏢 Empresa</span>'
    : '<span class="type-tag type-singular">👤 Pessoa</span>';
  let btnHtml = '';
  if (mode === 'sugestao'){
    const sent = sentTo.includes(u.id);
    btnHtml = '<button class="btn-full' + (isPro ? ' pro' : '') + '" ' + (sent ? 'disabled' : '') +
      ' onclick="sendRequest(\'' + u.id + '\', this)">' +
      (sent ? '<i class="fas fa-check"></i> Pedido enviado'
            : (isPro ? '<i class="fas fa-rss"></i> Seguir' : '<i class="fas fa-user-plus"></i> Adicionar Amigo')) + '</button>';
  } else if (mode === 'pedido'){
    btnHtml = '<div class="btn-row">' +
      '<button class="btn-full accept" onclick="answerRequest(' + extra + ', true)"><i class="fas fa-check"></i> Aceitar</button>' +
      '<button class="btn-full decline" onclick="answerRequest(' + extra + ', false)"><i class="fas fa-times"></i></button></div>';
  } else {
    btnHtml = '<div class="btn-row">' +
      '<a class="btn-full" style="text-align:center" href="mensagen.html"><i class="fas fa-comment-dots"></i> Mensagem</a>' +
      '<button class="btn-full decline" onclick="removeFriend(\'' + u.id + '\')"><i class="fas fa-user-minus"></i></button></div>';
  }
  return '<div class="card">' +
    '<div class="card-top"><img src="' + avatarOf(u) + '">' +
    '<div><div class="nm">' + esc(u.full_name || 'Utilizador') + tag + '</div>' +
    '<div class="cl">' + sectorLabel(u.sector) + (u.morada ? ' · ' + esc(u.morada) : '') + '</div></div></div>' +
    '<p class="bio">' + esc(u.bio || 'Sem descrição.') + '</p>' + btnHtml + '</div>';
}

function render(){
  const grid = document.getElementById('grid');
  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();

  if (currentTab === 'pedidos'){
    if (!incoming.length){
      grid.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i><b>Sem pedidos pendentes</b><p>Quando alguém te enviar um pedido, aparece aqui.</p></div>';
      return;
    }
    grid.innerHTML = incoming.map(r => card(r.user || {}, 'pedido', r.id)).join('');
    return;
  }

  let list = allUsers;
  if (currentTab === 'sugestoes') list = list.filter(u => !friends.includes(u.id));
  if (currentTab === 'amigos')    list = list.filter(u => friends.includes(u.id));
  if (filter === 'empresa')       list = list.filter(u => u.type === 'empresa');
  else if (filter)                list = list.filter(u => u.sector === filter);
  if (q) list = list.filter(u => (u.full_name || '').toLowerCase().includes(q));

  if (!list.length){
    grid.innerHTML = '<div class="empty"><i class="fas fa-users"></i><b>Nada por aqui</b><p>Experimenta outro filtro ou pesquisa.</p></div>';
    return;
  }
  grid.innerHTML = list.map(u => card(u, currentTab === 'sugestoes' ? 'sugestao' : 'amigo')).join('');
}

async function sendRequest(toId, btn){
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> A enviar...';
  const { error } = await supabaseClient.from('friend_requests').insert({
    from_id: me.id, to_id: toId, status: 'pendente'
  });
  if (error){
    toast('Erro: ' + error.message);
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-user-plus"></i> Adicionar Amigo';
    return;
  }
  sentTo.push(toId);
  toast(isPro ? 'Agora segues este perfil!' : 'Pedido de amizade enviado!');
  render();
}

async function answerRequest(reqId, accept){
  if (accept){
    const req = incoming.find(r => r.id === reqId);
    await supabaseClient.from('friend_requests').update({ status: 'aceite' }).eq('id', reqId);
    if (req){
      await supabaseClient.from('friendships').insert([
        { user_id: me.id, friend_id: req.from_id },
        { user_id: req.from_id, friend_id: me.id }
      ]);
    }
    toast('Pedido aceite! 🎉');
  } else {
    await supabaseClient.from('friend_requests').update({ status: 'recusado' }).eq('id', reqId);
    toast('Pedido recusado.');
  }
  await loadAll();
}

async function removeFriend(friendId){
  await supabaseClient.from('friendships').delete().or(
    'and(user_id.eq.' + me.id + ',friend_id.eq.' + friendId + '),' +
    'and(user_id.eq.' + friendId + ',friend_id.eq.' + me.id + ')');
  toast('Amizade removida.');
  await loadAll();
}
</script>
</body>
</html>
