<!DOCTYPE html>
<html lang="pt-pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amigos | Feira Comercial</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="perfil-campos.js"></script>
<style>
:root{ --brand:#2563eb; --pro:#7c3aed; --bg:#0f172a; --surface:#1e293b; --hover:#334155;
  --text:#f8fafc; --sub:#94a3b8; --border:rgba(255,255,255,.1); --ok:#22c55e; --danger:#ef4444; --radius:16px; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}

/* TOPBAR — com identidade do utilizador (foto + nome) */
.topbar{position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:12px;
  padding:12px 20px;background:rgba(15,23,42,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar .logo{font-weight:800;color:#f0ec0f}
.me-chip{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);
  padding:4px 12px 4px 4px;border-radius:30px;border:1px solid var(--border);cursor:pointer}
.me-chip img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--hover)}
.me-chip span{font-size:13px;font-weight:700;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
.icon-btn:hover{background:var(--hover)}

.main{max-width:1100px;margin:0 auto;padding:26px 20px 110px}

/* PRO CARD */
.pro-card{background:linear-gradient(135deg,#1e293b,#334155);border:1px solid var(--pro);
  padding:18px 22px;border-radius:var(--radius);display:flex;justify-content:space-between;
  align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.pro-card h3{font-weight:800}
.pro-card p{color:var(--sub);font-size:13px}
#togglePro{padding:10px 22px;border-radius:10px;border:none;background:var(--pro);color:#fff;font-weight:800;cursor:pointer}

/* SEARCH + FILTERS */
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:30px;padding:10px 16px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px}
.search i{color:var(--sub)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 18px;background:var(--surface);border:1px solid var(--border);
  border-radius:100px;color:var(--sub);font-size:13px;cursor:pointer;transition:.2s}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip:hover{border-color:var(--brand)}

/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tab{flex:1;padding:11px;border:none;background:var(--surface);color:var(--sub);font-weight:700;
  font-size:13px;border-radius:10px;cursor:pointer;border:1px solid var(--border)}
.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.tab .badge{background:#fff;color:var(--brand);border-radius:20px;padding:1px 8px;font-size:11px;margin-left:6px}
.tab:not(.active) .badge{background:var(--danger);color:#fff}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;transition:.25s;position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--brand)}
.card-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.card-top img{width:54px;height:54px;border-radius:14px;object-fit:cover;background:var(--hover)}
.card-top .nm{font-weight:800;font-size:15px}
.card-top .cl{font-size:11px;color:var(--sub)}
.type-tag{font-size:10px;padding:2px 8px;border-radius:20px;margin-left:6px}
.type-empresa{background:rgba(124,58,237,.2);color:#c4b5fd}
.type-singular{background:rgba(37,99,235,.2);color:#93c5fd}
.bio{font-size:13px;color:var(--sub);margin-bottom:16px;min-height:34px}
.btn-full{width:100%;padding:12px;border:none;border-radius:10px;background:var(--brand);color:#fff;
  font-weight:800;cursor:pointer;transition:.2s;font-size:13px}
.btn-full.pro{background:var(--pro)}
.btn-full:hover{filter:brightness(1.15)}
.btn-full:disabled{background:var(--hover);color:var(--sub);cursor:default}
.btn-row{display:flex;gap:8px}
.btn-row .btn-full{flex:1}
.filtro{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:30px;padding:10px 14px;font-size:13px;max-width:200px}
.btn-full.seguindo{background:var(--hover);color:var(--text)}
a.card-top{color:inherit}
.accept{background:var(--ok)} .decline{background:var(--hover);color:var(--sub)}

.empty{text-align:center;padding:50px 20px;color:var(--sub);grid-column:1/-1}
.empty i{font-size:44px;opacity:.35;display:block;margin-bottom:12px}
.skel{height:180px;border-radius:var(--radius);background:var(--surface);animation:pu 1.4s infinite}
@keyframes pu{0%,100%{opacity:.5}50%{opacity:1}}

#toast{position:fixed;bottom:28px;right:28px;background:var(--brand);color:#fff;padding:14px 24px;
  border-radius:12px;display:none;z-index:9999;font-weight:700;animation:sl .3s}
@keyframes sl{from{transform:translateX(100px);opacity:0}to{transform:none;opacity:1}}

/* BOTTOM NAV MOBILE */
.bottom-nav{display:none}
@media(max-width:760px){
  .main{padding:16px 14px 110px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;z-index:1000;
    background:rgba(15,23,42,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);
    justify-content:space-around;align-items:center}
  .bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--sub)}
  .bottom-nav a.active{color:var(--brand)}
  .bottom-nav i{font-size:19px}
  .topbar .logo{font-size:16px}
}
.fc-msg-badge{position:absolute;top:-4px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;font-family:sans-serif;pointer-events:none}
</style>

<base target="_self">
</head>
<body>

<header class="topbar">
  <a class="logo" href="index.html"><i class="fas fa-bolt"></i> Feira Comercial</a>
  <a class="icon-btn" href="index.html" title="Início"><i class="fas fa-home"></i></a>
  <a class="icon-btn" href="mensagen.html" title="Mensagens" style="position:relative;"><i class="fas fa-comment-dots"></i><span data-fc-msgs class="fc-msg-badge" style="display:none"></span></a>
  <a class="me-chip" href="perfil.html">
    <img data-fc-avatar src="" alt="">
    <span data-fc-name>…</span>
  </a>
</header>

<main class="main">
  <div class="toolbar">
    <div class="search">
      <i class="fas fa-search"></i>
      <input id="searchInput" placeholder="Pesquisar pessoas ou empresas..." oninput="agendarPesquisa()">
    </div>
    <select id="filtroProvincia" class="filtro" onchange="carregarPerfis()"></select>
    <select id="filtroSetor" class="filtro" onchange="carregarPerfis()"></select>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-sug" onclick="setTab('sugestoes',this)">✨ Descobrir</button>
    <button class="tab" id="tab-seg" onclick="setTab('seguindo',this)">➕ A seguir <span class="badge" id="segBadge" style="display:none">0</span></button>
    <button class="tab" id="tab-fol" onclick="setTab('seguidores',this)">👥 Seguidores <span class="badge" id="folBadge" style="display:none">0</span></button>
  </div>

  <div class="chips" id="chips">
    <div class="chip active" onclick="setFilter('',this)">Todos</div>
    <div class="chip" onclick="setFilter('empresa',this)">🏢 Empresas</div>
    <div class="chip" onclick="setFilter('singular',this)">👤 Pessoas</div>
  </div>

  <div class="grid" id="grid">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html"><i class="fas fa-home"></i>Início</a>
  <a href="amigos.html" class="active"><i class="fas fa-user-friends"></i>Amigos</a>
  <a href="mensagen.html" style="position:relative;"><i class="fas fa-comment-dots"></i>Mensagens<span data-fc-msgs class="fc-msg-badge" style="display:none"></span></a>
  <a href="perfil.html"><i class="fas fa-user"></i>Perfil</a>
</nav>

<div id="toast"></div>

<script>
// ─────────────────────────────────────
//  AMIGOS = SEGUIR PESSOAS E EMPRESAS (tabela followers)
// ─────────────────────────────────────
let me = null;
let perfis = [];          // resultado de "Descobrir"
let seguindo = new Set(); // ids que eu sigo
let seguidores = new Set(); // ids que me seguem
let perfisSeguindo = [];
let perfisSeguidores = [];
let currentTab = 'sugestoes';
let filter = '';

const CAMPOS = 'id, full_name, username, type, sector, bio, city, province, avatar_url, created_at';

(async function init(){
  document.getElementById('filtroProvincia').innerHTML = FCP.opcoes(FCP.PROVINCIAS, '', 'Todas as províncias');
  document.getElementById('filtroSetor').innerHTML = FCP.opcoes(FCP.SETORES, '', 'Todos os setores');
  me = await FC.boot();
  if (!me) return;
  await Promise.all([carregarLigacoes(), carregarPerfis()]);
})();

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 2600);
}

function avatarOf(u){
  return u.avatar_url || ('https://ui-avatars.com/api/?name=' + encodeURIComponent(u.full_name || 'U') +
    '&background=random&color=fff&size=128');
}
const esc = FCP.esc;

// quem eu sigo e quem me segue
async function carregarLigacoes(){
  const [a, b] = await Promise.all([
    supabaseClient.from('followers').select(`following_id, p:perfis!followers_following_id_fkey(${CAMPOS})`).eq('follower_id', me.id),
    supabaseClient.from('followers').select(`follower_id, p:perfis!followers_follower_id_fkey(${CAMPOS})`).eq('following_id', me.id)
  ]);
  if (a.error) console.warn(a.error.message);
  if (b.error) console.warn(b.error.message);
  perfisSeguindo = (a.data || []).map(r => r.p).filter(Boolean);
  perfisSeguidores = (b.data || []).map(r => r.p).filter(Boolean);
  seguindo = new Set(perfisSeguindo.map(p => p.id));
  seguidores = new Set(perfisSeguidores.map(p => p.id));
  atualizarBadges();
  render();
}

function atualizarBadges(){
  const s = document.getElementById('segBadge'), f = document.getElementById('folBadge');
  s.textContent = seguindo.size; s.style.display = seguindo.size ? '' : 'none';
  f.textContent = seguidores.size; f.style.display = seguidores.size ? '' : 'none';
}

let _tPesq;
function agendarPesquisa(){ clearTimeout(_tPesq); _tPesq = setTimeout(() => { carregarPerfis(); render(); }, 300); }

// "Descobrir": pesquisa na base de dados
async function carregarPerfis(){
  if (!me) return;
  const termo = document.getElementById('searchInput').value.replace(/[%,()]/g, ' ').trim();
  const prov = document.getElementById('filtroProvincia').value;
  const setor = document.getElementById('filtroSetor').value;
  let q = supabaseClient.from('perfis').select(CAMPOS).neq('id', me.id).eq('visibility', 'publico');
  if (termo) q = q.ilike('full_name', `%${termo}%`);
  if (prov) q = q.eq('province', prov);
  if (setor) q = q.eq('sector', setor);
  if (filter) q = q.eq('type', filter);
  const { data, error } = await q.order('created_at', { ascending: false }).limit(60);
  if (error) { console.warn(error.message); toast('Erro ao carregar perfis'); return; }
  perfis = data || [];
  render();
}

function setTab(tab, btn){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setFilter(f, el){
  filter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('filtroSetor').style.display = f === 'singular' ? 'none' : '';
  carregarPerfis();
}

// filtros também se aplicam às listas "A seguir" e "Seguidores"
function filtrarLocal(lista){
  const termo = document.getElementById('searchInput').value.trim().toLowerCase();
  const prov = document.getElementById('filtroProvincia').value;
  const setor = document.getElementById('filtroSetor').value;
  return lista.filter(u =>
    (!filter || u.type === filter) &&
    (!prov || u.province === prov) &&
    (!setor || u.sector === setor) &&
    (!termo || (u.full_name || '').toLowerCase().includes(termo)));
}

function render(){
  const grid = document.getElementById('grid');
  let lista, vazio;
  if (currentTab === 'seguindo') { lista = filtrarLocal(perfisSeguindo); vazio = 'Ainda não segues ninguém. Vai a "Descobrir".'; }
  else if (currentTab === 'seguidores') { lista = filtrarLocal(perfisSeguidores); vazio = 'Ainda ninguém te segue.'; }
  else { lista = perfis; vazio = 'Nenhum perfil encontrado.'; }

  if (!lista.length) {
    grid.innerHTML = `<div class="empty"><i class="fas fa-user-friends"></i>${vazio}</div>`;
    return;
  }
  grid.innerHTML = lista.map(cartao).join('');
}

function cartao(u){
  const empresa = u.type === 'empresa';
  const sigo = seguindo.has(u.id);
  const segueMe = seguidores.has(u.id);
  const local = [u.city, u.province].filter(Boolean).join(', ');
  const sub = [empresa ? u.sector : null, local].filter(Boolean).join(' · ');
  return `
  <div class="card">
    <a class="card-top" href="perfil.html?id=${u.id}">
      <img src="${esc(avatarOf(u))}" alt="" loading="lazy">
      <div>
        <div class="nm">${esc(u.full_name || 'Utilizador')}
          <span class="type-tag ${empresa ? 'type-empresa' : 'type-singular'}">${empresa ? '🏢 Empresa' : '👤 Pessoa'}</span></div>
        <div class="cl">${esc(sub)}${segueMe ? ' · <b style="color:var(--ok)">segue-te</b>' : ''}</div>
      </div>
    </a>
    <p class="bio">${esc((u.bio || '').slice(0, 120))}</p>
    <div class="btn-row">
      <button class="btn-full ${sigo ? 'seguindo' : (empresa ? 'pro' : '')}" onclick="alternarSeguir('${u.id}', this)">
        ${sigo ? '<i class="fas fa-check"></i> A seguir' : '<i class="fas fa-plus"></i> Seguir'}
      </button>
      <button class="btn-full decline" onclick="enviarMensagem('${u.id}')" title="Enviar mensagem"><i class="fas fa-comment-dots"></i></button>
    </div>
  </div>`;
}

async function alternarSeguir(id, btn){
  btn.disabled = true;
  const u = [...perfis, ...perfisSeguidores, ...perfisSeguindo].find(x => x.id === id);
  if (seguindo.has(id)) {
    const { error } = await supabaseClient.from('followers').delete().eq('follower_id', me.id).eq('following_id', id);
    if (error) { toast('Erro: ' + error.message); btn.disabled = false; return; }
    seguindo.delete(id);
    perfisSeguindo = perfisSeguindo.filter(p => p.id !== id);
    toast('Deixaste de seguir ' + (u ? u.full_name : ''));
  } else {
    const { error } = await supabaseClient.from('followers').insert({ follower_id: me.id, following_id: id, created_at: Date.now() });
    if (error && !String(error.message).includes('duplicate')) { toast('Erro: ' + error.message); btn.disabled = false; return; }
    seguindo.add(id);
    if (u && !perfisSeguindo.some(p => p.id === id)) perfisSeguindo.unshift(u);
    toast('Agora segues ' + (u ? u.full_name : ''));
  }
  atualizarBadges();
  render();
}

function enviarMensagem(id){
  window.location.href = 'mensagen.html?para=' + encodeURIComponent(id);
}
</script>
</body>
</html>
