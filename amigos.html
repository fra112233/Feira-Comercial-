<html lang="pt-pt">
<head>
<meta charset="UTF-8">
<script src="i18n.js"></script>
<meta name="robots" content="noindex">

<title>Amigos | Feira Comercial</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="atualizacao.js"></script>

<style>
:root{ --brand:#2563eb; --pro:#7c3aed; --bg:#0f172a; --surface:#1e293b; --hover:#334155;
  --text:#f8fafc; --sub:#94a3b8; --border:rgba(255,255,255,.1); --ok:#22c55e; --danger:#ef4444; --radius:16px; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}

/* TOPBAR — com identidade do utilizador (foto + nome) */
.topbar{position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:12px;
  padding:12px 20px;background:rgba(15,23,42,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar .logo{font-weight:800;color:#f0ec0f}
.me-chip{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);
  padding:4px 12px 4px 4px;border-radius:30px;border:1px solid var(--border);cursor:pointer}
.me-chip img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--hover)}
.me-chip span{font-size:13px;font-weight:700;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
.icon-btn:hover{background:var(--hover)}

.main{max-width:1100px;margin:0 auto;padding:26px 20px 110px}

/* PRO CARD */
.pro-card{background:linear-gradient(135deg,#1e293b,#334155);border:1px solid var(--pro);
  padding:18px 22px;border-radius:var(--radius);display:flex;justify-content:space-between;
  align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.pro-card h3{font-weight:800}
.pro-card p{color:var(--sub);font-size:13px}
#togglePro{padding:10px 22px;border-radius:10px;border:none;background:var(--pro);color:#fff;font-weight:800;cursor:pointer}

/* SEARCH + FILTERS */
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:30px;padding:10px 16px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px}
.search i{color:var(--sub)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 18px;background:var(--surface);border:1px solid var(--border);
  border-radius:100px;color:var(--sub);font-size:13px;cursor:pointer;transition:.2s}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip:hover{border-color:var(--brand)}

/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tab{flex:1;padding:11px;border:none;background:var(--surface);color:var(--sub);font-weight:700;
  font-size:13px;border-radius:10px;cursor:pointer;border:1px solid var(--border)}
.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.tab .badge{background:#fff;color:var(--brand);border-radius:20px;padding:1px 8px;font-size:11px;margin-left:6px}
.tab:not(.active) .badge{background:var(--danger);color:#fff}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;transition:.25s;position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--brand)}
.card-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.card-top img{width:54px;height:54px;border-radius:14px;object-fit:cover;background:var(--hover)}
.card-top .nm{font-weight:800;font-size:15px}
.card-top .cl{font-size:11px;color:var(--sub)}
.type-tag{font-size:10px;padding:2px 8px;border-radius:20px;margin-left:6px}
.type-empresa{background:rgba(124,58,237,.2);color:#c4b5fd}
.type-singular{background:rgba(37,99,235,.2);color:#93c5fd}
.bio{font-size:13px;color:var(--sub);margin-bottom:16px;min-height:34px}
.btn-full{width:100%;padding:12px;border:none;border-radius:10px;background:var(--brand);color:#fff;
  font-weight:800;cursor:pointer;transition:.2s;font-size:13px}
.btn-full.pro{background:var(--pro)}
.btn-full:hover{filter:brightness(1.15)}
.btn-full:disabled{background:var(--hover);color:var(--sub);cursor:default}
.btn-row{display:flex;gap:8px}
.btn-row .btn-full{flex:1}
.filtro{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:30px;padding:10px 14px;font-size:13px;max-width:200px}
.btn-full.seguindo{background:var(--hover);color:var(--text)}
a.card-top{color:inherit}
.accept{background:var(--ok)} .decline{background:var(--hover);color:var(--text)}

.empty{text-align:center;padding:50px 20px;color:var(--sub);grid-column:1/-1}
.empty i{font-size:44px;opacity:.35;display:block;margin-bottom:12px}
.skel{height:180px;border-radius:var(--radius);background:var(--surface);animation:pu 1.4s infinite}
@keyframes pu{0%,100%{opacity:.5}50%{opacity:1}}

#toast{position:fixed;bottom:28px;right:28px;background:var(--brand);color:#fff;padding:14px 24px;
  border-radius:12px;display:none;z-index:9999;font-weight:700;animation:sl .3s}
@keyframes sl{from{transform:translateX(100px);opacity:0}to{transform:none;opacity:1}}

/* BOTTOM NAV MOBILE */
.bottom-nav{display:none}
@media(max-width:760px){
  .main{padding:16px 14px 110px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;z-index:1000;
    background:rgba(15,23,42,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);
    justify-content:space-around;align-items:center}
  .bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--sub)}
  .bottom-nav a.active{color:var(--brand)}
  .bottom-nav i{font-size:19px}
  .topbar .logo{font-size:16px}
}
.fc-msg-badge{position:absolute;top:-4px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;font-family:sans-serif;pointer-events:none}
/* nada empurra a página para os lados no telemóvel */
html, body { max-width: 100%; overflow-x: hidden; }
.icon-btn{flex-shrink:0}
.topbar .logo{white-space:nowrap}
.bio:empty{display:none}
.card-info{min-width:0}
.card-top .un{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-top .nseg{font-size:12px;color:var(--sub);margin-top:3px}
.card-top .nseg b{color:var(--text)}
.motivo{font-size:12px;color:#c7d2fe;background:rgba(37,99,235,.14);border:1px solid rgba(37,99,235,.3);border-radius:10px;padding:7px 10px;margin:-2px 0 12px;line-height:1.45}
.motivo i{color:#93c5fd;margin-right:5px}
.motivo b{color:var(--text)}
.btn-full.volta{background:var(--ok);color:#052e16}
.sec-titulo{font-size:15px;font-weight:800;color:var(--sub);margin:4px 2px 12px;letter-spacing:.2px}
.ver-mais{display:block;margin:22px auto 0;padding:12px 30px;min-height:44px;border-radius:30px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:800;font-size:14px;cursor:pointer}
.ver-mais:hover{border-color:var(--brand)}
.ver-mais:disabled{opacity:.7;cursor:default}
.conf-fundo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px}
.conf{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.conf h3{font-size:17px;margin-bottom:8px;line-height:1.35}
.conf p{font-size:13px;color:var(--sub);line-height:1.5;margin-bottom:18px}
.conf-botoes{display:flex;gap:8px}
.conf-botoes button{flex:1;min-height:44px;border-radius:10px;border:none;font-weight:800;font-size:13px;cursor:pointer}
.conf-nao{background:var(--hover);color:var(--text)}
.conf-sim{background:var(--danger);color:#fff}
@media(max-width:760px){
  .topbar{gap:8px;padding:10px 14px}
  /* Início e Mensagens já estão na barra de baixo */
  .topbar a.icon-btn{display:none}
  .me-chip{padding:3px}
  .me-chip span{display:none}
}
</style>

<base target="_self">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="images/icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>

<header class="topbar">
  <a class="logo" href="index.html"><i class="fas fa-bolt"></i> Feira Comercial</a>
  <a class="icon-btn" href="index.html" title="Início"><i class="fas fa-home"></i></a>
  <a class="icon-btn" href="mensagen.html" title="Mensagens" style="position:relative;"><i class="fas fa-comment-dots"></i><span data-fc-msgs class="fc-msg-badge" style="display:none"></span></a>
  <a class="me-chip" href="perfil.html">
    <img data-fc-avatar src="" alt="">
    <span data-fc-name>…</span>
  </a>
  <button class="icon-btn" onclick="FCMenu.abrir()" title="Menu" aria-label="Menu"><i class="fas fa-bars"></i></button>
</header>

<main class="main">
  <div class="toolbar">
    <div class="search">
      <i class="fas fa-search"></i>
      <input id="searchInput" type="search" placeholder="Nome, @utilizador, setor ou cidade…" aria-label="Pesquisar por nome, @utilizador, setor ou cidade" oninput="agendarPesquisa()">
    </div>
    <select id="filtroProvincia" class="filtro" onchange="carregarPerfis()"></select>
    <select id="filtroSetor" class="filtro" onchange="carregarPerfis()"></select>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-sug" onclick="setTab('sugestoes',this)">✨ Descobrir</button>
    <button class="tab" id="tab-seg" onclick="setTab('seguindo',this)">➕ A seguir <span class="badge" id="segBadge" style="display:none">0</span></button>
    <button class="tab" id="tab-fol" onclick="setTab('seguidores',this)">👥 Seguidores <span class="badge" id="folBadge" style="display:none">0</span></button>
  </div>

  <div class="chips" id="chips">
    <div class="chip active" onclick="setFilter('',this)">Todos</div>
    <div class="chip" onclick="setFilter('empresa',this)">🏢 Empresas</div>
    <div class="chip" onclick="setFilter('singular',this)">👤 Pessoas</div>
  </div>

  <h2 class="sec-titulo" id="secTitulo">Sugestões para ti</h2>
  <div class="grid" id="grid">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
  <button type="button" class="ver-mais" id="verMais" style="display:none" onclick="verMais()">Ver mais</button>
</main>

<nav class="bottom-nav">
  <a href="index.html"><i class="fas fa-home"></i>Início</a>
  <a href="amigos.html" class="active"><i class="fas fa-user-friends"></i>Amigos</a>
  <a href="mensagen.html" style="position:relative;"><i class="fas fa-comment-dots"></i>Mensagens<span data-fc-msgs class="fc-msg-badge" style="display:none"></span></a>
  <a href="perfil.html"><i class="fas fa-user"></i>Perfil</a>
</nav>

<div id="toast"></div>

<script>
// ─────────────────────────────────────
//  AMIGOS = SEGUIR PESSOAS E EMPRESAS (tabela followers)
// ─────────────────────────────────────
let me = null;
let perfis = [];          // resultado de "Descobrir" (sugestões ou pesquisa)
let seguindo = new Set(); // ids que eu sigo
let seguidores = new Set(); // ids que me seguem
let perfisSeguindo = [];
let perfisSeguidores = [];
let currentTab = 'sugestoes';
let filter = '';
const POR_PAGINA = 30;
let temMais = false;      // há mais perfis para "Ver mais"
let aCarregar = false;
let pedidoAtual = 0;      // ignora respostas de pesquisas antigas
let semMigracao = false;  // antes da migração 063: pesquisa simples
const contagens = new Map();   // id → número de seguidores
const CAMPOS = 'id, full_name, username, type, sector, bio, city, province, avatar_url, created_at';

(async function init(){
  document.getElementById('filtroProvincia').innerHTML = FCP.opcoes(FCP.PROVINCIAS, '', 'Todas as províncias');
  document.getElementById('filtroSetor').innerHTML = FCP.opcoes(FCP.SETORES, '', 'Todos os setores');
  const q = new URLSearchParams(location.search).get('q');
  if (q) document.getElementById('searchInput').value = q;
  me = await FC.boot();
  if (!me) return;
  await Promise.all([carregarLigacoes(), carregarPerfis()]);
})();

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 2600);
}

function avatarOf(u){
  return u.avatar_url || ('https://ui-avatars.com/api/?name=' + encodeURIComponent(u.full_name || 'U') +
    '&background=random&color=fff&size=128');
}
const esc = FCP.esc;
// sem acentos e em minúsculas ("eletronica" encontra "Eletrónica")
function semAcentos(t){ return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function nSeguidores(n){
  if (n == null) return '';
  const t = n >= 1000000 ? (n / 1000000).toFixed(1).replace('.0', '').replace('.', ',') + ' M'
          : n >= 10000 ? Math.round(n / 1000) + ' mil'
          : n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '').replace('.', ',') + ' mil' : String(n);
  return t + ' ' + (n === 1 ? FC.t('seguidor') : FC.t('seguidores'));
}

// quem eu sigo e quem me segue
async function carregarLigacoes(){
  const [a, b] = await Promise.all([
    supabaseClient.from('followers').select(`following_id, p:perfis!followers_following_id_fkey(${CAMPOS})`).eq('follower_id', me.id),
    supabaseClient.from('followers').select(`follower_id, p:perfis!followers_follower_id_fkey(${CAMPOS})`).eq('following_id', me.id)
  ]);
  if (a.error) console.warn(a.error.message);
  if (b.error) console.warn(b.error.message);
  perfisSeguindo = (a.data || []).map(r => r.p).filter(Boolean);
  perfisSeguidores = (b.data || []).map(r => r.p).filter(Boolean);
  seguindo = new Set(perfisSeguindo.map(p => p.id));
  seguidores = new Set(perfisSeguidores.map(p => p.id));
  atualizarBadges();
  render();
  // número de seguidores de quem aparece nas listas
  const ids = [...new Set([...seguindo, ...seguidores])].filter(id => !contagens.has(id));
  if (ids.length) {
    const r = await supabaseClient.rpc('contar_seguidores', { p_ids: ids });
    if (!r.error && Array.isArray(r.data)) { r.data.forEach(x => contagens.set(x.id, Number(x.seguidores) || 0)); render(); }
  }
}

function atualizarBadges(){
  const s = document.getElementById('segBadge'), f = document.getElementById('folBadge');
  s.textContent = seguindo.size; s.style.display = seguindo.size ? '' : 'none';
  f.textContent = seguidores.size; f.style.display = seguidores.size ? '' : 'none';
}

let _tPesq;
function agendarPesquisa(){ clearTimeout(_tPesq); _tPesq = setTimeout(() => { carregarPerfis(); render(); }, 300); }

function termoPesquisa(){ return document.getElementById('searchInput').value.replace(/[%,()]/g, ' ').trim(); }

// "Descobrir": sem pesquisa são sugestões para ti; com pesquisa, procura em nome, @, setor e cidade
async function carregarPerfis(mais = false){
  if (!me) return;
  const termo = termoPesquisa();
  const prov = document.getElementById('filtroProvincia').value;
  const setor = document.getElementById('filtroSetor').value;
  const desde = mais ? perfis.length : 0;
  const pedido = ++pedidoAtual;
  aCarregar = true;
  if (mais) render();
  let data = null, error = null;
  if (!semMigracao) {
    ({ data, error } = await supabaseClient.rpc('descobrir_perfis', {
      p_termo: termo || null, p_provincia: prov || null, p_setor: setor || null, p_tipo: filter || null,
      p_desde: desde, p_limite: POR_PAGINA }));
    if (error && /descobrir_perfis|function|schema cache|PGRST202/i.test(error.message + ' ' + (error.code || ''))) { semMigracao = true; error = null; data = null; }
  }
  if (semMigracao) {
    // antes da migração 063: a pesquisa de sempre, por nome ou @utilizador
    const limpo = termo.replace(/^@/, '');
    let q = supabaseClient.from('perfis').select(CAMPOS).neq('id', me.id).eq('visibility', 'publico');
    if (limpo) q = q.or(`full_name.ilike.%${limpo}%,username.ilike.%${limpo}%`);
    if (prov) q = q.eq('province', prov);
    if (setor) q = q.eq('sector', setor);
    if (filter) q = q.eq('type', filter);
    ({ data, error } = await q.order('created_at', { ascending: false }).range(desde, desde + POR_PAGINA - 1));
  }
  if (pedido !== pedidoAtual) return;          // entretanto escreveu outra coisa
  aCarregar = false;
  if (error) { console.warn(error.message); toast('Erro ao carregar perfis'); render(); return; }
  const novos = data || [];
  novos.forEach(u => { if (u.seguidores != null) contagens.set(u.id, Number(u.seguidores) || 0); });
  perfis = mais ? perfis.concat(novos.filter(n => !perfis.some(p => p.id === n.id))) : novos;
  temMais = novos.length === POR_PAGINA;
  render();
}
function verMais(){ if (!aCarregar && temMais) carregarPerfis(true); }

function setTab(tab, btn){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setFilter(f, el){
  filter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('filtroSetor').style.display = f === 'singular' ? 'none' : '';
  carregarPerfis();
}

// filtros também se aplicam às listas "A seguir" e "Seguidores"
function filtrarLocal(lista){
  const termo = semAcentos(termoPesquisa().replace(/^@/, ''));
  const prov = document.getElementById('filtroProvincia').value;
  const setor = document.getElementById('filtroSetor').value;
  return lista.filter(u =>
    (!filter || u.type === filter) &&
    (!prov || u.province === prov) &&
    (!setor || u.sector === setor) &&
    (!termo || [u.full_name, u.username, u.sector, u.city, u.province].some(c => semAcentos(c).includes(termo))));
}

function render(){
  const grid = document.getElementById('grid');
  const titulo = document.getElementById('secTitulo');
  const btnMais = document.getElementById('verMais');
  let lista, vazio;
  if (currentTab === 'seguindo') { lista = filtrarLocal(perfisSeguindo); vazio = 'Ainda não segues ninguém. Vai a "Descobrir".'; }
  else if (currentTab === 'seguidores') { lista = filtrarLocal(perfisSeguidores); vazio = 'Ainda ninguém te segue.'; }
  else { lista = perfis; vazio = termoPesquisa() ? 'Nenhum perfil encontrado.' : 'Por agora não há sugestões. Experimente pesquisar um nome, setor ou cidade.'; }

  // título por cima dos cartões (só no Descobrir)
  if (currentTab === 'sugestoes') {
    titulo.style.display = '';
    titulo.textContent = termoPesquisa() ? FC.t('Resultados da pesquisa') : (semMigracao ? FC.t('Contas mais recentes') : FC.t('Sugestões para ti'));
  } else titulo.style.display = 'none';
  btnMais.style.display = currentTab === 'sugestoes' && temMais && lista.length ? '' : 'none';
  btnMais.disabled = aCarregar;
  btnMais.innerHTML = aCarregar ? '<i class="fas fa-spinner fa-spin"></i> ' + FC.t('A carregar…') : FC.t('Ver mais');

  if (!lista.length) {
    grid.innerHTML = `<div class="empty"><i class="fas fa-user-friends"></i>${vazio}</div>`;
    return;
  }
  grid.innerHTML = lista.map(cartao).join('');
  if (FC.aplicarSelos) FC.aplicarSelos(grid);    // coroa 👑 das lojas verificadas
}

// porque é que aparece nas sugestões
function motivo(u){
  if (currentTab !== 'sugestoes' || termoPesquisa()) return '';
  const n = Number(u.amigos_comum) || 0;
  if (u.amigo_nome && n > 0) {
    return `<i class="fas fa-user-group"></i> ${FC.t('Seguido por')} <b data-no-i18n>${esc(u.amigo_nome)}</b>` +
      (n > 1 ? ` ${FC.t('e mais')} ${n - 1} ${FC.t('que segues')}` : '');
  }
  if (u.mesma_cidade) return `<i class="fas fa-location-dot"></i> ${FC.t('Na tua cidade')}`;
  if (u.verificada) return `<i class="fas fa-crown"></i> ${FC.t('Loja verificada')}`;
  return '';
}

function cartao(u){
  const empresa = u.type === 'empresa';
  const sigo = seguindo.has(u.id);
  const segueMe = seguidores.has(u.id);
  const local = [u.city, u.province].filter(Boolean).join(', ');
  const sub = [empresa ? u.sector : null, local].filter(Boolean).join(' · ');
  const nSeg = contagens.has(u.id) ? contagens.get(u.id) : (u.seguidores != null ? Number(u.seguidores) : null);
  const porque = motivo(u);
  const textoBotao = sigo ? '<i class="fas fa-check"></i> ' + FC.t('A seguir')
    : segueMe ? '<i class="fas fa-user-plus"></i> ' + FC.t('Seguir de volta')
    : '<i class="fas fa-plus"></i> ' + FC.t('Seguir');
  return `
  <div class="card">
    <a class="card-top" href="perfil.html?id=${u.id}">
      <img src="${esc(avatarOf(u))}" alt="" loading="lazy">
      <div class="card-info">
        <div class="nm"><span data-no-i18n data-selo="${esc(u.id)}">${esc(u.full_name || FC.t('Utilizador'))}</span>
          <span class="type-tag ${empresa ? 'type-empresa' : 'type-singular'}">${empresa ? '🏢 Empresa' : '👤 Pessoa'}</span></div>
        ${u.username ? `<div class="un" data-no-i18n>@${esc(u.username)}</div>` : ''}
        <div class="cl">${esc(sub)}${segueMe ? ' · <b style="color:var(--ok)">' + FC.t('segue-te') + '</b>' : ''}</div>
        ${nSeg != null ? `<div class="nseg"><b>${esc(nSeguidores(nSeg).split(' ')[0])}</b> ${esc(nSeguidores(nSeg).split(' ').slice(1).join(' '))}</div>` : ''}
      </div>
    </a>
    ${porque ? `<div class="motivo">${porque}</div>` : ''}
    <p class="bio" data-no-i18n>${esc((u.bio || '').slice(0, 120))}</p>
    <div class="btn-row">
      <button class="btn-full ${sigo ? 'seguindo' : (segueMe ? 'volta' : (empresa ? 'pro' : ''))}" onclick="alternarSeguir('${u.id}', this)">${textoBotao}</button>
      <button class="btn-full decline" onclick="enviarMensagem('${u.id}')" title="Enviar mensagem"><i class="fas fa-comment-dots"></i> Mensagem</button>
    </div>
  </div>`;
}

// deixar de seguir pede confirmação (um toque sem querer não desfaz a ligação)
function confirmarDeixar(nome){
  return new Promise(resolve => {
    const fundo = document.createElement('div');
    fundo.className = 'conf-fundo';
    fundo.innerHTML = `<div class="conf" role="dialog" aria-modal="true" aria-labelledby="confTit">
      <h3 id="confTit">${FC.t('Deixar de seguir')} <span data-no-i18n>${esc(nome || '')}</span>?</h3>
      <p>${FC.t('Deixa de ver as publicações desta conta no início. Pode voltar a seguir quando quiser.')}</p>
      <div class="conf-botoes">
        <button type="button" class="conf-nao">${FC.t('Cancelar')}</button>
        <button type="button" class="conf-sim">${FC.t('Deixar de seguir')}</button>
      </div></div>`;
    const fim = v => { fundo.remove(); document.removeEventListener('keydown', tecla); resolve(v); };
    const tecla = e => { if (e.key === 'Escape') fim(false); };
    fundo.addEventListener('click', e => { if (e.target === fundo) fim(false); });
    fundo.querySelector('.conf-nao').onclick = () => fim(false);
    fundo.querySelector('.conf-sim').onclick = () => fim(true);
    document.addEventListener('keydown', tecla);
    document.body.appendChild(fundo);
    fundo.querySelector('.conf-nao').focus();
  });
}

async function alternarSeguir(id, btn){
  const u = [...perfis, ...perfisSeguidores, ...perfisSeguindo].find(x => x.id === id);
  const nome = u ? u.full_name : '';
  if (seguindo.has(id)) {
    if (!(await confirmarDeixar(nome))) return;
    btn.disabled = true;
    const { error } = await supabaseClient.from('followers').delete().eq('follower_id', me.id).eq('following_id', id);
    if (error) { toast('Erro: ' + FC.traduzirErro(error)); btn.disabled = false; return; }
    seguindo.delete(id);
    perfisSeguindo = perfisSeguindo.filter(p => p.id !== id);
    if (contagens.has(id)) contagens.set(id, Math.max(0, contagens.get(id) - 1));
    toast(FC.t('Deixaste de seguir') + ' ' + nome);
  } else {
    btn.disabled = true;
    const voltar = seguidores.has(id);
    const { error } = await supabaseClient.from('followers').insert({ follower_id: me.id, following_id: id, created_at: Date.now() });
    if (error && !String(error.message).includes('duplicate')) { toast('Erro: ' + FC.traduzirErro(error)); btn.disabled = false; return; }
    seguindo.add(id);
    if (u && !perfisSeguindo.some(p => p.id === id)) perfisSeguindo.unshift(u);
    if (!error && contagens.has(id)) contagens.set(id, contagens.get(id) + 1);
    toast((voltar ? FC.t('Agora seguem-se um ao outro:') : FC.t('Agora segues')) + ' ' + nome);
  }
  atualizarBadges();
  render();
}

function enviarMensagem(id){
  window.location.href = 'mensagen.html?para=' + encodeURIComponent(id);
}
</script>
