<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anúncios | Feira Comercial</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="images/icone-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="perfil-campos.js"></script>
<script src="menu.js"></script>
<style>
:root { --bg-card:#ffffff; --hover-bg:#f1f5f9; --primary:#0062ff; --accent:#ff4757; --ouro:#facc15; --bg:#f4f7f6; --text-main:#1e293b; --text-muted:#64748b; --border:#e2e8f0; }
* { margin:0; padding:0; box-sizing:border-box; font-family:Inter,'Segoe UI',system-ui,sans-serif; }
body { background:var(--bg); color:var(--text-main); }
a { color:inherit; text-decoration:none; }

/* CABEÇALHO */
.top-nav { background:var(--ouro); padding:.7rem 1.2rem; display:flex; justify-content:space-between; align-items:center; gap:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.1); position:sticky; top:0; z-index:100; }
.nav-left { display:flex; align-items:center; gap:12px; }
.logo-area img { height:52px; width:52px; border-radius:12px; object-fit:cover; background:#000; display:block; }
.btn-home { background:#fff; color:#1e293b; border-radius:8px; padding:8px 12px; font-weight:600; font-size:.85rem; display:flex; align-items:center; gap:6px; }
.titulo-nav { font-weight:800; font-size:1.1rem; }

.container { max-width:1000px; margin:20px auto; padding:0 15px 60px; }

/* AVISO PARA PESSOAS */
.aviso-pessoa { background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:14px; padding:12px 16px; font-size:.88rem; margin-bottom:16px; display:none; }

/* PESQUISA E FILTROS */
.search-area { background:#fff; padding:18px; border-radius:20px; border:1px solid var(--border); margin-bottom:20px; display:flex; flex-direction:column; gap:12px; }
.category-tabs { display:flex; gap:8px; flex-wrap:wrap; }
.tab-btn { padding:8px 14px; border-radius:10px; border:1px solid var(--border); background:#f8fafc; cursor:pointer; font-weight:600; font-size:.85rem; color:var(--text-muted); }
.tab-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.filtros { display:flex; gap:10px; flex-wrap:wrap; }
.search-bar, .filtros select { padding:11px 16px; border:2px solid var(--border); border-radius:12px; outline:none; font-size:.95rem; background:#fff; }
.search-bar { flex:1; min-width:200px; }

/* GRELHA DE ANÚNCIOS */
.feed { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px; }
.card { background:#fff; border-radius:20px; border:1px solid var(--border); overflow:hidden; display:flex; flex-direction:column; cursor:pointer; transition:.25s; }
.card:hover { border-color:var(--primary); transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.06); }
.card-img { width:100%; aspect-ratio:16/10; object-fit:cover; background:#e2e8f0; display:block; }
.card-sem-img { width:100%; aspect-ratio:16/10; display:flex; align-items:center; justify-content:center; font-size:42px; color:#94a3b8; background:linear-gradient(135deg,#f1f5f9,#e2e8f0); }
.card-body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
.card-title { font-size:1.05rem; font-weight:700; color:#0f172a; }
.card-desc { font-size:.85rem; color:var(--text-muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.preco { font-weight:800; color:#16a34a; font-size:1rem; }
.card-rodape { display:flex; align-items:center; gap:8px; margin-top:auto; padding-top:10px; border-top:1px solid #f1f5f9; font-size:.8rem; color:var(--text-muted); }
.card-rodape img { width:26px; height:26px; border-radius:50%; object-fit:cover; }
.card-rodape b { color:var(--text-main); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.badge { padding:4px 10px; border-radius:8px; font-size:.65rem; font-weight:800; text-transform:uppercase; display:inline-block; align-self:flex-start; }
.badge-vaga { background:#dbeafe; color:#1e40af; }
.badge-promo { background:#fee2e2; color:#991b1b; }
.badge-servico { background:#dcfce7; color:#166534; }
.badge-inativo { background:#e2e8f0; color:#475569; margin-left:6px; }

.btn { padding:10px 16px; border-radius:10px; font-weight:600; cursor:pointer; border:none; font-size:.88rem; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-view { background:var(--primary); color:#fff; }
.btn-claro { background:#f1f5f9; color:#1e293b; }
.btn-whats { background:#25d366; color:#fff; }
.btn-del { background:#fff1f2; color:var(--accent); }
.btn:disabled { opacity:.6; cursor:default; }

.vazio { grid-column:1/-1; text-align:center; padding:50px 20px; color:var(--text-muted); }
.vazio i { font-size:46px; opacity:.35; display:block; margin-bottom:12px; }

/* MODAIS */
.modal { display:none; position:fixed; inset:0; background:rgba(15,23,42,.8); backdrop-filter:blur(5px); z-index:1000; align-items:center; justify-content:center; padding:15px; }
.modal.aberto { display:flex; }
.modal-content { background:#fff; width:100%; max-width:560px; border-radius:24px; padding:24px; position:relative; max-height:92vh; overflow-y:auto; animation:popIn .3s ease; }
@keyframes popIn { from { transform:scale(.95); opacity:0; } to { transform:none; opacity:1; } }
.close-btn { position:absolute; top:14px; right:14px; width:38px; height:38px; background:#f1f5f9; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:1.4rem; cursor:pointer; border:2px solid var(--border); z-index:2; }
.detail-img { width:100%; max-height:320px; border-radius:18px; object-fit:cover; margin-bottom:16px; border:1px solid var(--border); }
.info-card { display:flex; flex-direction:column; gap:10px; margin-top:14px; padding-top:14px; border-top:1px solid #eee; }
.info-row { display:flex; align-items:flex-start; gap:10px; font-size:.93rem; }
.info-row i { color:var(--primary); width:18px; margin-top:3px; }
.empresa-box { display:flex; align-items:center; gap:12px; margin-top:16px; padding:12px; border-radius:14px; background:#f8fafc; }
.empresa-box img { width:46px; height:46px; border-radius:12px; object-fit:cover; }
.acoes-det { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
.acoes-det .btn { flex:1; min-width:140px; }

.form-group { margin-bottom:12px; }
.form-group label { display:block; font-size:.85rem; font-weight:700; margin-bottom:4px; color:#475569; }
.form-group input, .form-group textarea, .form-group select { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:12px; font-size:.97rem; outline:none; font-family:inherit; }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color:var(--primary); }
.duas { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.foto-prev { width:100%; max-height:200px; object-fit:cover; border-radius:12px; margin-top:8px; display:none; }
.ajuda { font-size:.78rem; color:var(--text-muted); margin-top:3px; }

#toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:12px 20px; border-radius:12px; z-index:2000; display:none; font-weight:600; }

@media (max-width:600px) {
  .duas { grid-template-columns:1fr; }
  .titulo-nav { display:none; }
}
/* nada empurra a página para os lados no telemóvel */
html, body { max-width: 100%; overflow-x: hidden; }
</style>
</head>
<body>

<nav class="top-nav">
  <div class="nav-left">
    <a href="index.html" class="logo-area"><img src="images/logo.jpg" alt="Feira Comercial"></a>
    <a href="index.html" class="btn-home"><i class="fa-solid fa-house"></i> Início</a>
    <span class="titulo-nav">Anúncios</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <button class="btn btn-view" id="btnAnunciar" style="display:none" onclick="abrirFormulario()"><i class="fa-solid fa-plus-circle"></i> Anunciar</button>
    <button class="btn btn-claro" onclick="FCMenu.abrir()" title="Menu" aria-label="Menu" style="padding:10px 13px;"><i class="fas fa-bars"></i></button>
  </div>
</nav>

<div class="container">
  <div class="aviso-pessoa" id="avisoPessoa">
    <i class="fas fa-info-circle"></i> Só <b>contas de empresa</b> podem publicar anúncios. Podes ver todos os anúncios e contactar as empresas.
  </div>

  <div class="search-area">
    <div class="category-tabs">
      <button class="tab-btn active" data-tipo="todos" onclick="filtrarTipo('todos', this)">Todos</button>
      <button class="tab-btn" data-tipo="promo" onclick="filtrarTipo('promo', this)">🏷️ Promoções</button>
      <button class="tab-btn" data-tipo="vaga" onclick="filtrarTipo('vaga', this)">💼 Vagas de emprego</button>
      <button class="tab-btn" data-tipo="servico" onclick="filtrarTipo('servico', this)">🛠️ Serviços</button>
      <button class="tab-btn" data-tipo="meus" id="tabMeus" style="display:none" onclick="filtrarTipo('meus', this)">⭐ Os meus anúncios</button>
    </div>
    <div class="filtros">
      <input type="text" id="searchInput" class="search-bar" placeholder="🔍 O que procura hoje?" oninput="agendar()">
      <select id="filtroProvincia" onchange="carregar()"></select>
    </div>
  </div>

  <main class="feed" id="feedContainer"></main>
</div>

<!-- FORMULÁRIO (só empresas) -->
<div class="modal" id="formModal" onclick="if(event.target===this) fecharModal('formModal')">
  <div class="modal-content">
    <div class="close-btn" onclick="fecharModal('formModal')">&times;</div>
    <h3 style="font-size:1.3rem;" id="formTitulo">Publicar anúncio</h3>
    <form id="adForm" style="margin-top:18px;" onsubmit="guardarAnuncio(event)">
      <div class="form-group"><label>Tipo de anúncio</label>
        <select id="tipo" onchange="ajustarCampos()">
          <option value="promo">🏷️ Promoção / Produto</option>
          <option value="vaga">💼 Vaga de emprego</option>
          <option value="servico">🛠️ Serviço</option>
        </select></div>
      <div class="form-group"><label>Título</label><input type="text" id="titulo" maxlength="120" required placeholder="Ex: Cimento 42.5 com 10% de desconto"></div>
      <div class="form-group"><label>Descrição</label><textarea id="descricao" rows="4" maxlength="3000" required placeholder="Detalhes, condições, como candidatar-se..."></textarea></div>
      <div class="duas">
        <div class="form-group"><label id="lblPreco">Preço</label><input type="text" id="preco" maxlength="60" placeholder="Ex: 1.500 MT"></div>
        <div class="form-group"><label>Válido até</label><input type="date" id="validade"></div>
      </div>
      <div class="form-group"><label>Local</label><input type="text" id="localizacao" maxlength="120" placeholder="Ex: Matola, Machava"></div>
      <div class="duas">
        <div class="form-group"><label>Contacto (WhatsApp/telefone)</label><input type="tel" id="contacto" maxlength="30" placeholder="Usa o da empresa se vazio"></div>
        <div class="form-group"><label>Link (opcional)</label><input type="text" id="link" maxlength="300" placeholder="www.site.co.mz"></div>
      </div>
      <div class="form-group"><label>Imagem</label><input type="file" id="imgInput" accept="image/*" onchange="previewFoto(event)">
        <img class="foto-prev" id="fotoPrev" alt=""><div class="ajuda">Será reduzida automaticamente para carregar rápido.</div></div>
      <button type="submit" class="btn btn-view" id="btnGuardar" style="width:100%; padding:15px; font-size:1rem; margin-top:8px;">Publicar agora</button>
    </form>
  </div>
</div>

<!-- DETALHES -->
<div class="modal" id="detailModal" onclick="if(event.target===this) fecharModal('detailModal')">
  <div class="modal-content">
    <div class="close-btn" onclick="fecharModal('detailModal')">&times;</div>
    <div id="detailView"></div>
  </div>
</div>

<div id="toast"></div>

<script>
let me = null;
let souEmpresa = false;
let anuncios = [];
let tipoAtual = 'todos';
let fotoFicheiro = null;
let emEdicao = null;      // anúncio a ser editado
const vistos = new Set();

const TIPOS = { promo: ['Promoção', 'badge-promo', 'fa-tag'], vaga: ['Vaga', 'badge-vaga', 'fa-briefcase'], servico: ['Serviço', 'badge-servico', 'fa-screwdriver-wrench'] };
const esc = FCP.esc;
const logo = p => (p && p.avatar_url) || ('https://ui-avatars.com/api/?name=' + encodeURIComponent((p && p.full_name) || 'E') + '&background=random&color=fff&size=128');

function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 2600); }
function abrirModal(id) { document.getElementById(id).classList.add('aberto'); document.body.style.overflow = 'hidden'; }
function fecharModal(id) { document.getElementById(id).classList.remove('aberto'); document.body.style.overflow = ''; }

(async function init() {
  document.getElementById('filtroProvincia').innerHTML = FCP.opcoes(FCP.PROVINCIAS, '', 'Todas as províncias');
  me = await FC.boot();
  if (!me) return;
  souEmpresa = me.type === 'empresa';
  document.getElementById('btnAnunciar').style.display = souEmpresa ? '' : 'none';
  document.getElementById('tabMeus').style.display = souEmpresa ? '' : 'none';
  document.getElementById('avisoPessoa').style.display = souEmpresa ? 'none' : 'block';
  await carregar();
  const a = new URLSearchParams(location.search).get('a');
  if (a) mostrarDetalhes(a);
})();

let _t;
function agendar() { clearTimeout(_t); _t = setTimeout(carregar, 300); }

function filtrarTipo(tipo, btn) {
  tipoAtual = tipo;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  carregar();
}

async function carregar() {
  if (!me) return;
  const feed = document.getElementById('feedContainer');
  const termo = document.getElementById('searchInput').value.replace(/[%,()]/g, ' ').trim();
  const prov = document.getElementById('filtroProvincia').value;

  let q = supabaseClient.from('vagas_anuncios')
    .select('*, empresa:perfis!vagas_anuncios_empresa_perfil_fkey(id, full_name, avatar_url, phone, whatsapp, province, city, sector, website)')
    .order('data_publicacao', { ascending: false })
    .limit(60);
  if (tipoAtual === 'meus') q = q.eq('empresa_id', me.id);
  else {
    q = q.eq('ativo', true);
    if (tipoAtual !== 'todos') q = q.eq('tipo', tipoAtual);
  }
  if (termo) q = q.or(`titulo.ilike.%${termo}%,descricao.ilike.%${termo}%,localizacao.ilike.%${termo}%`);

  const { data, error } = await q;
  if (error) { console.error(error.message); feed.innerHTML = '<p class="vazio">Erro ao carregar anúncios.</p>'; return; }

  const hoje = new Date().toISOString().slice(0, 10);
  anuncios = (data || []).filter(a =>
    (tipoAtual === 'meus' || !a.validade || a.validade >= hoje) &&     // esconde os que já expiraram
    (!prov || (a.empresa && a.empresa.province === prov)));
  render();
}

function render() {
  const feed = document.getElementById('feedContainer');
  if (!anuncios.length) {
    feed.innerHTML = `<div class="vazio"><i class="fas fa-bullhorn"></i>
      ${tipoAtual === 'meus' ? 'Ainda não publicaste anúncios.' : 'Ainda não há anúncios aqui.'}
      ${souEmpresa ? '<br><br><button class="btn btn-view" onclick="abrirFormulario()"><i class="fas fa-plus"></i> Publicar o primeiro</button>' : ''}</div>`;
    return;
  }
  const hoje = new Date().toISOString().slice(0, 10);
  feed.innerHTML = anuncios.map(a => {
    const [nomeTipo, classe, icone] = TIPOS[a.tipo] || TIPOS.promo;
    const expirado = a.validade && a.validade < hoje;
    return `
    <article class="card" onclick="mostrarDetalhes('${a.id}')">
      ${a.foto_url ? `<img src="${esc(a.foto_url)}" class="card-img" loading="lazy" alt="">` : `<div class="card-sem-img"><i class="fas ${icone}"></i></div>`}
      <div class="card-body">
        <div><span class="badge ${classe}">${nomeTipo}</span>${!a.ativo ? '<span class="badge badge-inativo">Pausado</span>' : ''}${expirado ? '<span class="badge badge-inativo">Expirado</span>' : ''}</div>
        <div class="card-title">${esc(a.titulo)}</div>
        ${a.preco ? `<div class="preco">${esc(a.preco)}</div>` : ''}
        <p class="card-desc">${esc(a.descricao)}</p>
        ${a.localizacao ? `<div style="font-size:.78rem;color:var(--primary);font-weight:700;"><i class="fa-solid fa-location-dot"></i> ${esc(a.localizacao)}</div>` : ''}
        <div class="card-rodape">
          <img src="${esc(logo(a.empresa))}" alt=""><b>${esc(a.empresa ? a.empresa.full_name : 'Empresa')}</b>
          <span>${new Date(a.data_publicacao).toLocaleDateString('pt-PT')}</span>
        </div>
      </div>
    </article>`;
  }).join('');
}

async function mostrarDetalhes(id) {
  let a = anuncios.find(x => x.id === id);
  if (!a) {
    const { data } = await supabaseClient.from('vagas_anuncios')
      .select('*, empresa:perfis!vagas_anuncios_empresa_perfil_fkey(id, full_name, avatar_url, phone, whatsapp, province, city, sector, website)')
      .eq('id', id).maybeSingle();
    a = data;
  }
  if (!a) { toast('Este anúncio já não existe.'); return; }
  if (!vistos.has(a.id) && a.empresa_id !== me.id) { vistos.add(a.id); supabaseClient.rpc('ver_anuncio', { aid: a.id }); }

  const e = a.empresa || {};
  const [nomeTipo, classe] = TIPOS[a.tipo] || TIPOS.promo;
  const meu = a.empresa_id === me.id;
  const contacto = a.contacto || e.whatsapp || e.phone || '';
  const wa = FCP.numeroWhatsApp(contacto);
  const msgWa = encodeURIComponent(`Olá! Vi o vosso anúncio "${a.titulo}" na Feira Comercial.`);
  document.getElementById('detailView').innerHTML = `
    ${a.foto_url ? `<img src="${esc(a.foto_url)}" class="detail-img" alt="">` : ''}
    <span class="badge ${classe}">${nomeTipo}</span>
    <h2 style="margin:8px 0;">${esc(a.titulo)}</h2>
    ${a.preco ? `<div class="preco" style="font-size:1.2rem;margin-bottom:10px;">${esc(a.preco)}</div>` : ''}
    <p style="color:var(--text-muted);line-height:1.6;white-space:pre-line;">${esc(a.descricao)}</p>
    <div class="info-card">
      ${a.localizacao ? `<div class="info-row"><i class="fa-solid fa-location-dot"></i><span><b>Local:</b> ${esc(a.localizacao)}</span></div>` : ''}
      ${a.validade ? `<div class="info-row"><i class="fa-solid fa-calendar-check"></i><span><b>Válido até:</b> ${new Date(a.validade + 'T12:00').toLocaleDateString('pt-PT')}</span></div>` : ''}
      ${contacto ? `<div class="info-row"><i class="fa-solid fa-phone"></i><span><b>Contacto:</b> ${esc(contacto)}</span></div>` : ''}
      ${a.link ? `<div class="info-row"><i class="fa-solid fa-link"></i><a href="${esc(FCP.linkSite(a.link))}" target="_blank" rel="noopener" style="color:var(--primary);">${esc(a.link)}</a></div>` : ''}
      ${meu ? `<div class="info-row"><i class="fa-solid fa-eye"></i><span><b>Visto</b> ${a.views || 0} vezes</span></div>` : ''}
    </div>
    <a class="empresa-box" href="perfil.html?id=${e.id}">
      <img src="${esc(logo(e))}" alt="">
      <div><b>${esc(e.full_name || 'Empresa')}</b><div style="font-size:.8rem;color:var(--text-muted);">${esc([e.sector, e.city, e.province].filter(Boolean).join(' · '))}</div></div>
      <i class="fas fa-chevron-right" style="margin-left:auto;color:#94a3b8;"></i>
    </a>
    <div class="acoes-det">
      ${meu ? `
        <button class="btn btn-claro" onclick="editarAnuncio('${a.id}')"><i class="fas fa-pen"></i> Editar</button>
        <button class="btn btn-claro" onclick="alternarAtivo('${a.id}', ${!a.ativo})"><i class="fas ${a.ativo ? 'fa-pause' : 'fa-play'}"></i> ${a.ativo ? 'Pausar' : 'Reativar'}</button>
        <button class="btn btn-del" onclick="apagarAnuncio('${a.id}')"><i class="fas fa-trash-alt"></i> Apagar</button>`
      : `
        ${wa ? `<a class="btn btn-whats" href="https://wa.me/${wa}?text=${msgWa}" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> WhatsApp</a>` : ''}
        <a class="btn btn-view" href="mensagen.html?para=${e.id}"><i class="fas fa-comment-dots"></i> Mensagem</a>
        ${contacto ? `<a class="btn btn-claro" href="tel:${esc(contacto.replace(/\s/g, ''))}"><i class="fas fa-phone"></i> Ligar</a>` : ''}`}
      <button class="btn btn-claro" onclick="partilharAnuncio('${a.id}')"><i class="fas fa-share"></i> Partilhar</button>
    </div>`;
  abrirModal('detailModal');
}

async function partilharAnuncio(id) {
  const url = location.origin + location.pathname + '?a=' + id;
  try {
    if (navigator.share) await navigator.share({ title: 'Anúncio na Feira Comercial', url });
    else { await navigator.clipboard.writeText(url); toast('Link copiado!'); }
  } catch (e) {}
}

// ─── PUBLICAR / EDITAR (só empresas) ───
function ajustarCampos() {
  const t = document.getElementById('tipo').value;
  document.getElementById('lblPreco').textContent = t === 'vaga' ? 'Salário' : 'Preço';
  document.getElementById('preco').placeholder = t === 'vaga' ? 'Ex: 25.000 MT / a combinar' : 'Ex: 1.500 MT';
}

function abrirFormulario() {
  if (!souEmpresa) { toast('Só contas de empresa podem publicar anúncios.'); return; }
  emEdicao = null;
  document.getElementById('adForm').reset();
  fotoFicheiro = null;
  document.getElementById('fotoPrev').style.display = 'none';
  document.getElementById('formTitulo').textContent = 'Publicar anúncio';
  document.getElementById('btnGuardar').textContent = 'Publicar agora';
  document.getElementById('localizacao').value = [me.city, me.province].filter(Boolean).join(', ');
  ajustarCampos();
  abrirModal('formModal');
}

function editarAnuncio(id) {
  const a = anuncios.find(x => x.id === id);
  if (!a) return;
  fecharModal('detailModal');
  emEdicao = a;
  fotoFicheiro = null;
  ['tipo', 'titulo', 'descricao', 'preco', 'validade', 'localizacao', 'contacto', 'link'].forEach(k => {
    document.getElementById(k).value = a[k] || '';
  });
  const prev = document.getElementById('fotoPrev');
  if (a.foto_url) { prev.src = a.foto_url; prev.style.display = 'block'; } else prev.style.display = 'none';
  document.getElementById('formTitulo').textContent = 'Editar anúncio';
  document.getElementById('btnGuardar').textContent = 'Guardar alterações';
  ajustarCampos();
  abrirModal('formModal');
}

async function reduzirImagem(file, max = 1200) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return blob ? new File([blob], 'anuncio.jpg', { type: 'image/jpeg' }) : file;
  } catch (e) { return file; }
}

async function previewFoto(e) {
  const f = e.target.files[0];
  if (!f) return;
  fotoFicheiro = await reduzirImagem(f);
  const prev = document.getElementById('fotoPrev');
  prev.src = URL.createObjectURL(fotoFicheiro);
  prev.style.display = 'block';
}

async function guardarAnuncio(e) {
  e.preventDefault();
  if (!souEmpresa) return;
  const btn = document.getElementById('btnGuardar');
  const textoBtn = btn.textContent;
  btn.disabled = true; btn.textContent = 'A guardar...';
  try {
    let foto_url = emEdicao ? emEdicao.foto_url : null;
    if (fotoFicheiro) {
      const caminho = `${me.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      const { error } = await supabaseClient.storage.from('ads_media').upload(caminho, fotoFicheiro, { contentType: 'image/jpeg' });
      if (error) throw error;
      foto_url = supabaseClient.storage.from('ads_media').getPublicUrl(caminho).data.publicUrl;
    }
    const v = id => document.getElementById(id).value.trim();
    const dados = {
      tipo: v('tipo'), titulo: v('titulo'), descricao: v('descricao'),
      preco: v('preco') || null, validade: v('validade') || null, localizacao: v('localizacao') || null,
      contacto: v('contacto') || null, link: v('link') || null, foto_url
    };
    const { error } = emEdicao
      ? await supabaseClient.from('vagas_anuncios').update(dados).eq('id', emEdicao.id)
      : await supabaseClient.from('vagas_anuncios').insert(Object.assign({ empresa_id: me.id }, dados));
    if (error) throw error;
    fecharModal('formModal');
    toast(emEdicao ? 'Anúncio atualizado!' : 'Anúncio publicado! 🎉');
    emEdicao = null;
    await carregar();
  } catch (err) {
    toast('Erro: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = textoBtn;
  }
}

async function alternarAtivo(id, ativo) {
  const { error } = await supabaseClient.from('vagas_anuncios').update({ ativo }).eq('id', id);
  if (error) { toast('Erro: ' + error.message); return; }
  fecharModal('detailModal');
  toast(ativo ? 'Anúncio reativado' : 'Anúncio pausado (já não aparece aos outros)');
  carregar();
}

async function apagarAnuncio(id) {
  if (!confirm('Apagar este anúncio permanentemente?')) return;
  const a = anuncios.find(x => x.id === id);
  const { error } = await supabaseClient.from('vagas_anuncios').delete().eq('id', id);
  if (error) { toast('Erro: ' + error.message); return; }
  const caminho = a && a.foto_url && a.foto_url.split('/storage/v1/object/public/ads_media/')[1];
  if (caminho) supabaseClient.storage.from('ads_media').remove([caminho]);
  fecharModal('detailModal');
  toast('Anúncio apagado');
  carregar();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { fecharModal('formModal'); fecharModal('detailModal'); } });
</script>
