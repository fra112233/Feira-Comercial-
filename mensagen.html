function mmss(seg) { seg = Math.max(0, Math.round(seg || 0)); return Math.floor(seg / 60) + ':' + String(seg % 60).padStart(2, '0'); }
function segDe(t) { const m = /^(\d+):(\d{2})$/.exec(String(t || '').trim()); return m ? Number(m[1]) * 60 + Number(m[2]) : 0; }

// formato que toca em Android, iPhone e computador (m4a quando o navegador sabe gravar; senão webm/ogg)
function tipoAudio() {
    if (!window.MediaRecorder) return null;
    const tipos = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
    for (const t of tipos) { try { if (MediaRecorder.isTypeSupported(t)) return t; } catch (e) {} }

}
function extensaoAudio(tipo) {

async function comecarGravacao() {
    if (grav || !activeContactId || bloqueei.has(activeContactId)) return;
    const tipo = tipoAudio();

        showToast('Este navegador não grava áudio. Experimente o Chrome.');

    fecharRespostas();

    document.getElementById('gravarTempo').textContent = '0:00';
    atualizarBotaoEnviar();
    avisarEscrever('gravar');
    g.timer = setInterval(() => {
        const seg = (Date.now() - g.inicio) / 1000;
        document.getElementById('gravarTempo').textContent = mmss(Math.floor(seg));
        avisarEscrever('gravar');
        if (seg >= VOZ_MAX) { showToast('Chegou aos 5 minutos: a mensagem foi enviada.'); pararGravacao(true); }

function pararGravacao(enviar) {
    const g = grav;
    if (!g) return;
    g.enviar = !!enviar;
    g.duracao = (Date.now() - g.inicio) / 1000;
    try {
        if (g.rec.state !== 'inactive') { try { g.rec.requestData(); } catch (e) {} g.rec.stop(); }
        else terminarGravacao(g);
    } catch (e) { terminarGravacao(g); }
    // o botão e a caixa voltam já (o ficheiro termina em segundo plano)
    if (grav === g) grav = null;
    document.getElementById('chatFooter').classList.remove('a-gravar');
    atualizarBotaoEnviar();

}

function terminarGravacao(g) {
    if (g.fim) return;
    g.fim = true;
    clearInterval(g.timer);
    try { g.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    if (grav === g) {
        grav = null;
        document.getElementById('chatFooter').classList.remove('a-gravar');
        atualizarBotaoEnviar();
    }
    if (!g.enviar) return;
    const seg = g.duracao || (Date.now() - g.inicio) / 1000;
    if (seg < 1 || !g.partes.length) { showToast('Mensagem de voz demasiado curta.'); return; }
    const tipo = ((g.rec && g.rec.mimeType) || (g.partes[0] && g.partes[0].type) || 'audio/webm').split(';')[0] || 'audio/webm';

    if (!f) {
        const ja = new Set((respostas || []).map(r => r.texto.trim()));
        const sug = rrSugestoes().filter(t => !ja.has(t));
        if (sug.length && (respostas || []).length < 6) {
            html += `<div class="rr-sub">${FC.t('Sugestões')}</div>` + sug.map(t => `<div class="rr-item">
                <button type="button" class="rr-usar" onclick="rrUsarTexto(this.textContent)">${escHtml(t)}</button>
                <button type="button" class="rr-acao" title="Guardar" aria-label="Guardar esta sugestão" onclick="rrAdicionar(this.previousElementSibling.textContent)"><i class="fas fa-plus"></i></button>
            </div>`).join('');
        }
        html += `<div class="rr-item"><button type="button" class="rr-usar" style="color:var(--ouro-texto);font-weight:700" onclick="rrAbrirForm(null)"><i class="fas fa-plus"></i> ${FC.t('Nova resposta rápida')}</button></div>`;
    }
    lista.innerHTML = html;
}

function rrModoGerir() { rrGerir = !rrGerir; rrFecharForm(); rrDesenhar(); }

function rrUsar(id) {
    const r = (respostas || []).find(x => String(x.id) === String(id));
    if (r) rrUsarTexto(r.texto);
}
function rrUsarTexto(texto) {
    const el = document.getElementById('msgInput');
    // escreveu "/preço" para procurar: o atalho é substituído pela resposta
    el.value = rrFiltro || /^\/\S*$/.test(el.value.trim()) ? texto : (el.value.trim() ? el.value.replace(/\s*$/, ' ') + texto : texto);
    fecharRespostas();
    el.focus();
    autoResize(el);
    // pôr o cursor no primeiro [espaço a preencher], se houver
    const i = el.value.indexOf('[');
    const j = i >= 0 ? el.value.indexOf(']', i) : -1;
    try { if (i >= 0 && j > i) el.setSelectionRange(i, j + 1); else el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
}

// "/" no início da caixa abre as respostas rápidas e filtra pelo que se escreve a seguir
function rrAtalho(valor) {
    const painel = document.getElementById('rrPainel');
    if (!painel) return;
    const m = /^\/(\S*)$/.exec(valor || '');
    if (m) {
        rrFiltro = m[1];
        painel.dataset.atalho = '1';
        if (!painel.classList.contains('show') || !respostas) mostrarPainelRespostas();
        else rrDesenhar();
    } else if (painel.dataset.atalho === '1') {
        fecharRespostas();
    }
}

function rrAbrirForm(id) {
    rrEditar = id;
    const r = id ? (respostas || []).find(x => String(x.id) === String(id)) : null;
    document.getElementById('rrFormTitulo').textContent = r ? FC.t('Editar resposta rápida') : FC.t('Nova resposta rápida');
    const t = document.getElementById('rrTexto');
    t.value = r ? r.texto : '';
    document.getElementById('rrForm').style.display = 'flex';
    t.focus();
}
function rrFecharForm() {
    rrEditar = null;
    const f = document.getElementById('rrForm');
    if (f) f.style.display = 'none';
}
async function rrGuardar(ev) {
    ev.preventDefault();
    const texto = document.getElementById('rrTexto').value.trim();
    if (!texto) { showToast('Escreva a resposta.'); return; }
    if (rrEditar) await rrMudar(rrEditar, texto); else await rrAdicionar(texto);
    rrFecharForm();
}
async function rrAdicionar(texto) {
    texto = String(texto || '').trim().slice(0, 1000);
    if (!texto) return;
    await carregarRespostas();
    if (respostas.some(r => r.texto.trim() === texto)) { showToast('Essa resposta já está guardada.'); return; }
    if (respostas.length >= RR_MAX) { showToast('Pode guardar no máximo 30 respostas rápidas.'); return; }
    if (rrNaConta) {
        const { data, error } = await supabaseClient.from('respostas_rapidas').insert({ texto, ordem: respostas.length }).select('id, texto').single();
        if (error) { showToast(erroDeRede(error) ? 'Sem rede. Tente de novo.' : 'Não foi possível guardar: ' + FC.traduzirErro(error)); return; }
        respostas.push(data);
    } else {
        respostas.push({ id: 'l' + Date.now(), texto });
        rrGuardarLocal();
    }
    showToast('Resposta rápida guardada.');
    rrDesenhar();
}
async function rrMudar(id, texto) {
    const r = respostas.find(x => String(x.id) === String(id));
    if (!r) return;
    if (rrNaConta) {
        const { error } = await supabaseClient.from('respostas_rapidas').update({ texto }).eq('id', r.id);
        if (error) { showToast(erroDeRede(error) ? 'Sem rede. Tente de novo.' : 'Não foi possível guardar: ' + FC.traduzirErro(error)); return; }
    }
    r.texto = texto;
    if (!rrNaConta) rrGuardarLocal();
    showToast('Resposta rápida guardada.');
    rrDesenhar();
}
async function rrApagar(id) {
    const r = respostas.find(x => String(x.id) === String(id));
    if (!r || !confirm(FC.t('Apagar esta resposta rápida?') + '\n\n' + r.texto)) return;
    if (rrNaConta) {
        const { error } = await supabaseClient.from('respostas_rapidas').delete().eq('id', r.id);
        if (error) { showToast(erroDeRede(error) ? 'Sem rede. Tente de novo.' : 'Não foi possível apagar: ' + FC.traduzirErro(error)); return; }
    }
    respostas = respostas.filter(x => x !== r);
    if (!rrNaConta) rrGuardarLocal();
    rrDesenhar();
}

// ─── ANEXAR (📎) ─────────────────────────────────────────
// 📎 abre um menu: Documento, Fotos e vídeos (galeria), Gravar vídeo.
// O botão 📷 da caixa abre logo a câmara (no computador abre a escolha de ficheiro).
function abrirAnexar(ev) {
    if (ev) ev.stopPropagation();
    const m = document.getElementById('anexarMenu');
    if (m.classList.contains('show')) { fecharAnexar(); return; }
    fecharRespostas();
    const ep = document.getElementById('emojiPicker'); if (ep) ep.classList.remove('show');
    m.classList.add('show');
    document.getElementById('anexarBtn').setAttribute('aria-expanded', 'true');
    const primeiro = m.querySelector('.anexar-item'); if (primeiro) primeiro.focus();
}
function fecharAnexar() {
    const m = document.getElementById('anexarMenu');
    if (!m || !m.classList.contains('show')) return;
    m.classList.remove('show');
    document.getElementById('anexarBtn').setAttribute('aria-expanded', 'false');
}
// teclado: Enter/Espaço numa opção abre a escolha de ficheiro
document.getElementById('anexarMenu').addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('anexar-item')) {
        e.preventDefault(); e.target.querySelector('input').click();
    }
});
document.addEventListener('click', e => {
    if (e.target.isConnected && !e.target.closest('#anexarMenu, #anexarBtn')) fecharAnexar();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharAnexar(); });

// tocar fora do painel fecha-o
document.addEventListener('click', e => {
    const p = document.getElementById('rrPainel');
    // (um botão do painel que já foi redesenhado deixa de estar na página: não conta como "fora")
    if (p && p.classList.contains('show') && e.target.isConnected && !e.target.closest('#rrPainel, #rrBtn, #msgInput')) fecharRespostas();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharRespostas(); });
</script>
