<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recibo | Feira Comercial</title>
<link rel="icon" href="favicon.ico">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root { --tinta: #1a1a1a; --sub: #555; --linha: #c9c9c9; --ouro: #c8961e; --ouro-claro: #fbf3dc; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #e9e9ec; color: var(--tinta); font-family: Arial, "Helvetica Neue", Helvetica, sans-serif; }
  .barra { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 12px 16px; background: #0b0b0c; }
  .barra button, .barra a { border: none; border-radius: 10px; padding: 11px 18px; font: 700 14px Arial, sans-serif; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  .barra .pdf { background: linear-gradient(135deg, #f3c64e, #d9a52e); color: #000; }
  .barra .voltar { background: #1f1f25; color: #f4f4f5; border: 1px solid #2c2c34; }
  .dica { text-align: center; color: #666; font-size: 12.5px; margin: 10px 16px 0; }

  .folha { width: 210mm; min-height: 297mm; margin: 14px auto 30px; background: #fff; padding: 14mm 14mm 12mm; box-shadow: 0 6px 28px rgba(0,0,0,.18); position: relative; }
  .topo { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
  .marca img { width: 62mm; display: block; }
  .emissor { font-size: 10.5px; line-height: 1.5; color: #333; margin-top: 6px; }
  .emissor b { font-size: 12px; color: var(--tinta); }
  .titulo { text-align: right; }
  .titulo h1 { margin: 0; font-size: 24px; letter-spacing: .5px; color: var(--ouro); font-weight: 800; }
  .titulo .via { font-size: 10.5px; font-style: italic; color: var(--sub); margin-top: 2px; }
  .titulo .num { margin-top: 12px; font-size: 13px; }
  .titulo .num b { font-size: 18px; }
  .fita { height: 3px; background: linear-gradient(90deg, var(--ouro), #f3c64e); margin: 10px 0 12px; border-radius: 2px; }

  .caixas { display: grid; grid-template-columns: 1.35fr 1fr; gap: 10px; }
  .caixa { border: 1px solid var(--linha); border-radius: 8px; padding: 10px 12px 8px; position: relative; }
  .caixa .rot { position: absolute; top: -9px; left: 10px; background: #fff; padding: 0 6px; font-weight: 800; font-size: 11.5px; letter-spacing: .4px; }
  .campo { display: grid; grid-template-columns: 30mm 1fr; gap: 6px; font-size: 11.5px; padding: 3px 0; border-bottom: 1px dotted #ddd; }
  .campo:last-child { border-bottom: none; }
  .campo span { color: var(--sub); }
  .campo span i { display: block; font-size: 9px; color: #888; }

  table.itens { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 11.5px; }
  table.itens th { background: var(--ouro-claro); border: 1px solid var(--linha); padding: 6px; font-size: 11px; }
  table.itens th i { display: block; font-weight: 400; font-size: 9px; color: #777; }
  table.itens td { border: 1px solid var(--linha); padding: 6px 7px; height: 22px; }
  table.itens td.n { text-align: right; white-space: nowrap; }
  table.itens td.c { text-align: center; }

  .base { display: grid; grid-template-columns: 1fr 1.15fr; gap: 10px; margin-top: 10px; }
  .totais { border: 1px solid var(--linha); border-radius: 8px; overflow: hidden; font-size: 11.5px; }
  .totais .l { display: grid; grid-template-columns: 1fr auto; padding: 6px 10px; border-bottom: 1px solid #e6e6e6; }
  .totais .l i { display: block; font-size: 9px; color: #888; }
  .totais .l.total { background: var(--ouro-claro); font-weight: 800; font-size: 13px; }
  .totais .extenso { padding: 7px 10px; font-size: 11px; }
  .totais .extenso b { display: block; font-size: 10px; color: var(--sub); }
  .pago { border: 1px solid var(--linha); border-radius: 8px; padding: 10px 12px; font-size: 11.5px; }
  .pago h3 { margin: 0 0 6px; font-size: 12px; }
  .selo { display: inline-block; margin-top: 8px; border: 2px solid #1f9d55; color: #1f9d55; font-weight: 800; padding: 4px 10px; border-radius: 6px; transform: rotate(-4deg); letter-spacing: 1px; }

  .assin { display: grid; grid-template-columns: 1fr 1fr; gap: 30mm; margin-top: 18mm; text-align: center; font-size: 11px; }
  .assin > div { border-top: 1px solid #888; padding-top: 4px; position: relative; }
  .assin .vend { position: relative; }
  .assin .assinatura { position: absolute; left: 40%; bottom: calc(100% - 6px); transform: translateX(-50%); max-width: 62mm; max-height: 22mm; }
  .assin .carimbo { position: absolute; right: -10mm; bottom: calc(100% - 27mm); width: 40mm; height: 40mm; transform: rotate(-8deg); opacity: .92; pointer-events: none; mix-blend-mode: multiply; }
  .assin i { display: block; color: #777; font-size: 9.5px; }
  .rodape { position: absolute; left: 14mm; right: 14mm; bottom: 9mm; font-size: 9px; color: #888; text-align: center; border-top: 1px solid #eee; padding-top: 5px; }
  .aviso-iva { margin-top: 8px; font-size: 9.5px; color: #777; }

  .estado { max-width: 520px; margin: 40px auto; background: #fff; border-radius: 16px; padding: 28px; text-align: center; font-size: 15px; color: #333; }

  /* telemóvel: a mesma folha A4 do PDF, só encolhida para caber no ecrã (antes o desenho mudava e ficava diferente do recibo) */
  .folha.encolhida { margin: 0; transform-origin: top left; }
  .moldura { overflow: hidden; margin: 8px auto 20px; }
  @page { size: A4; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .barra, .dica { display: none !important; }
    .moldura { width: auto !important; height: auto !important; overflow: visible; margin: 0; }
    .folha { width: 210mm; min-height: 297mm; margin: 0; box-shadow: none; padding: 14mm 14mm 12mm; transform: none !important; }
    .topo { grid-template-columns: 1fr auto; } .titulo { text-align: right; }
    .caixas { grid-template-columns: 1.35fr 1fr; } .base { grid-template-columns: 1fr 1.15fr; }
    .campo { grid-template-columns: 30mm 1fr; } .marca img { width: 62mm; }
    .assin { gap: 30mm; margin-top: 18mm; } .rodape { position: absolute; margin: 0; }
    .assin .carimbo { right: -10mm; width: 40mm; height: 40mm; bottom: calc(100% - 27mm); }
    .assin .assinatura { max-width: 62mm; max-height: 22mm; left: 40%; }
  }
</style>
</head>
<body>
<div class="barra">
  <button class="pdf" type="button" onclick="window.print()">⬇ Guardar PDF / Imprimir</button>
  <a class="voltar" href="javascript:history.length>1?history.back():location.href='mensalidade.html'">← Voltar</a>
</div>
<p class="dica">Para guardar em PDF: toque em <b>Guardar PDF / Imprimir</b> e escolha <b>Guardar como PDF</b>.</p>
<div id="conteudo"><div class="estado">A carregar o recibo…</div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mt = n => Number(n || 0).toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
// datas do recibo sempre na hora de Maputo (documento oficial), seja qual for o fuso do aparelho
const partesMaputo = d => Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Maputo', day: 'numeric', month: 'numeric', year: 'numeric' }).formatToParts(new Date(d)).map(p => [p.type, Number(p.value)]));
const data = d => { const p = partesMaputo(d); return p.day + ' de ' + MESES[p.month - 1] + ' de ' + p.year; };
const METODO = { banco: 'Transferência bancária', mpesa: 'M-Pesa', emola: 'e-Mola' };

// ─── valor por extenso (português) ───
function extensoInt(n) {
  const U = ['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','catorze','quinze','dezasseis','dezassete','dezoito','dezanove'];
  const D = ['', '', 'vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const C = ['', 'cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const ate999 = x => {
    if (x === 0) return '';
    if (x === 100) return 'cem';
    const c = Math.floor(x / 100), r = x % 100, p = [];
    if (c) p.push(C[c]);
    if (r) p.push(r < 20 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' e ' + U[r % 10] : ''));
    return p.join(' e ');
  };
  if (n === 0) return 'zero';
  const milhoes = Math.floor(n / 1e6), milhares = Math.floor((n % 1e6) / 1000), resto = n % 1000, p = [];
  if (milhoes) p.push(milhoes === 1 ? 'um milhão' : ate999(milhoes) + ' milhões');
  if (milhares) p.push(milhares === 1 ? 'mil' : ate999(milhares) + ' mil');
  if (resto) p.push(ate999(resto));
  // "mil e cem", "dois mil e quinhentos": junta com "e" quando o último grupo é < 100 ou centena redonda
  if (p.length > 1 && (resto < 100 || resto % 100 === 0) && resto) { const u = p.pop(); return p.join(' ') + ' e ' + u; }
  return p.join(' ');
}
function extenso(valor) {
  const cent = Math.round(Number(valor) * 100), int = Math.floor(cent / 100), c = cent % 100;
  let t = extensoInt(int) + (int === 1 ? ' metical' : ' meticais');
  if (c) t += ' e ' + extensoInt(c) + (c === 1 ? ' centavo' : ' centavos');
  return t.charAt(0).toUpperCase() + t.slice(1);
}

// carimbo da Feira Comercial (azul de carimbo ou dourado da marca — escolhido na Administração)
function carimbo(e) {
  const dourado = e.carimbo_cor === 'dourado';
  const tinta = dourado ? '#a87412' : '#1b3a7a';
  const nuit = (e.recibo_nuit || '').trim();
  return '<svg class="carimbo" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" aria-label="Carimbo Feira Comercial">' +
    '<defs><path id="cbCima" d="M 32,110 A 78,78 0 0 1 188,110"/><path id="cbBaixo" d="M 35,110 A 75,75 0 0 0 185,110"/></defs>' +
    '<g fill="none" stroke="' + tinta + '"><circle cx="110" cy="110" r="104" stroke-width="3.2"/><circle cx="110" cy="110" r="98" stroke-width="0.9"/><circle cx="110" cy="110" r="60" stroke-width="0.9"/></g>' +
    '<text fill="' + tinta + '" font-family="Georgia, \'Times New Roman\', serif" font-size="17.5" font-weight="700" letter-spacing="2.2"><textPath href="#cbCima" startOffset="50%" text-anchor="middle">FEIRA COMERCIAL</textPath></text>' +
    '<text fill="' + tinta + '" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="2.2"><textPath href="#cbBaixo" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">EXPLORE · EXIBA · EXPANDA</textPath></text>' +
    '<circle cx="23" cy="110" r="2.6" fill="' + tinta + '"/><circle cx="197" cy="110" r="2.6" fill="' + tinta + '"/>' +
    '<image href="images/carimbo-' + (dourado ? 'dourado' : 'azul') + '.png" x="76" y="62" width="68" height="68"/>' +
    '<line x1="86" y1="136" x2="134" y2="136" stroke="' + tinta + '" stroke-width="0.8"/>' +
    '<text x="110" y="148" text-anchor="middle" fill="' + tinta + '" font-family="Arial, sans-serif" font-size="7.6" font-weight="700" letter-spacing="1.2">' + (nuit ? 'NUIT ' + esc(nuit) : 'MAPUTO') + '</text>' +
  '</svg>';
}

function linhaCampo(pt, en, v) {
  return '<div class="campo"><span>' + pt + (en ? '<i>' + en + '</i>' : '') + '</span><b>' + (v ? esc(v) : '&nbsp;') + '</b></div>';
}

function mostrar(r) {
  const e = r.emissor || {};
  const comIva = e.iva_ativo === 'sim' && !!(e.recibo_nuit || '').trim();
  const taxa = Number(e.iva_taxa || 17) / 100;
  const pago = Number(r.valor || 0);
  let base = pago, iva = 0, total = pago;
  if (comIva) {
    if (e.iva_incluido === 'nao') { base = pago; iva = Math.round(pago * taxa * 100) / 100; total = base + iva; }
    else { base = Math.round(pago / (1 + taxa) * 100) / 100; iva = Math.round((pago - base) * 100) / 100; total = pago; }
  }
  const meses = Number(r.meses || 1), unit = base / meses;
  const numero = 'FC-' + partesMaputo(r.confirmado_em).year + '-' + String(r.numero || r.id).padStart(5, '0');
  const tituloDoc = comIva ? 'FACTURA/RECIBO' : 'RECIBO';
  document.title = tituloDoc + ' ' + numero + ' | Feira Comercial';
  const c = r.cliente || {};
  const morada = [c.morada, c.cidade].filter(Boolean).join(', ');
  const vazias = Array.from({ length: 6 }, () => '<tr><td></td><td></td><td></td><td></td><td></td></tr>').join('');

  $('conteudo').innerHTML =
  '<div class="moldura"><div class="folha">' +
    '<div class="topo">' +
      '<div><div class="marca"><img src="images/logo-horizontal.png" alt="Feira Comercial"></div>' +
        '<div class="emissor"><b>' + esc(e.recibo_nome || 'Feira Comercial') + '</b><br>' +
          (e.recibo_morada ? esc(e.recibo_morada) + '<br>' : 'Maputo – Moçambique<br>') +
          'Email: ' + esc(e.recibo_email || 'contacto@feira-comercial.com') + (e.recibo_telefone ? ' · Tel: ' + esc(e.recibo_telefone) : '') + '<br>' +
          'Website: www.feira-comercial.com' +
          (e.recibo_nuit ? '<br><b>NUIT: ' + esc(e.recibo_nuit) + '</b>' : '') +
        '</div></div>' +
      '<div class="titulo"><h1>' + tituloDoc + '</h1><div class="via">(ORIGINAL PARA CLIENTE)</div>' +
        '<div class="num">Nº <b>' + numero + '</b></div></div>' +
    '</div>' +
    '<div class="fita"></div>' +
    '<div class="caixas">' +
      '<div class="caixa"><span class="rot">CLIENTE</span>' +
        linhaCampo('Nome:', 'Name', c.nome) + linhaCampo('Endereço:', 'Address', morada) +
        linhaCampo('Província:', 'Province', c.provincia) + linhaCampo('País:', 'Country', 'Moçambique') +
        linhaCampo('Telefone:', 'Phone', c.telefone) + linhaCampo('NUIT:', '', c.nuit) +
      '</div>' +
      '<div class="caixa"><span class="rot">DOCUMENTO</span>' +
        linhaCampo('Data:', 'Invoice date', data(r.confirmado_em)) +
        linhaCampo('Cód. cliente:', 'Customer No.', 'EMP-' + String(r.empresa_id || '').slice(0, 8).toUpperCase()) +
        linhaCampo('Período:', 'Billing period', meses + (meses === 1 ? ' mês' : ' meses')) +
        linhaCampo('Pagamento:', 'Payment method', METODO[r.metodo] || r.metodo) +
      '</div>' +
    '</div>' +
    '<table class="itens"><thead><tr>' +
      '<th style="width:9%">No.<i>A</i></th><th>Descrição<i>(1)</i></th><th style="width:10%">Qtd<i>(2)</i></th>' +
      '<th style="width:17%">Preço unitário<i>(3)</i></th><th style="width:17%">Valor (MZN)<i>(4)=(2)×(3)</i></th>' +
    '</tr></thead><tbody>' +
      '<tr><td class="c">1</td><td>Mensalidade Feira Comercial — conta de empresa (publicações, anúncios e Live)</td>' +
      '<td class="c">' + String(meses).padStart(2, '0') + '</td><td class="n">' + mt(unit) + '</td><td class="n">' + mt(base) + '</td></tr>' +
      vazias +
    '</tbody></table>' +
    '<div class="base">' +
      '<div class="pago"><h3>Pagamento recebido</h3>' +
        linhaCampo('Método:', '', METODO[r.metodo] || r.metodo) +
        linhaCampo('Referência:', '', r.referencia) +
        linhaCampo('Recebido em:', '', data(r.confirmado_em)) +
        (r.metodo === 'banco' && e.banco_nome ? linhaCampo('Banco:', '', e.banco_nome + (e.banco_titular ? ' — ' + e.banco_titular : '')) : '') +
        '<span class="selo">PAGO</span>' +
      '</div>' +
      '<div class="totais">' +
        '<div class="l"><span>Subtotal (1)<i>Subtotal</i></span><b>' + mt(base) + '</b></div>' +
        '<div class="l"><span>Desconto (2)<i>Discount</i></span><b>' + mt(0) + '</b></div>' +
        (comIva
          ? '<div class="l"><span>Total antes de IVA (3)=(1−2)<i>Total before VAT</i></span><b>' + mt(base) + '</b></div>' +
            '<div class="l"><span>IVA (4)=(3)×' + Math.round(taxa * 100) + '%<i>VAT</i></span><b>' + mt(iva) + '</b></div>' +
            '<div class="l total"><span>Total depois de IVA (5)=(3)+(4)</span><b>' + mt(total) + ' MT</b></div>'
          : '<div class="l total"><span>Total pago</span><b>' + mt(total) + ' MT</b></div>') +
        '<div class="extenso"><b>Por extenso / In words:</b>' + esc(extenso(total)) + '</div>' +
      '</div>' +
    '</div>' +
    (comIva ? '' : '<div class="aviso-iva">Documento não sujeito a IVA.</div>') +
    '<div class="assin"><div>CLIENTE<i>(Assinatura)</i></div><div class="vend">' +
      (r.assinatura && /^data:image\/png;base64,/.test(r.assinatura) ? '<img class="assinatura" src="' + r.assinatura + '" alt="Assinatura">' : '') +
      carimbo(e) +
      esc(e.recibo_nome || 'Feira Comercial') + '<i>(Assinatura autorizada)</i></div></div>' +
    '<div class="rodape">Documento processado por computador · ' + numero + ' · Feira Comercial — www.feira-comercial.com</div>' +
  '</div></div>';
  ajustar();
}

// encolhe a folha A4 inteira para a largura do ecrã (no telemóvel fica igual ao PDF, só mais pequena)
function ajustar() {
  const m = document.querySelector('.moldura'), f = document.querySelector('.folha');
  if (!m || !f) return;
  f.style.transform = ''; f.classList.remove('encolhida'); m.style.width = m.style.height = '';
  const larg = f.offsetWidth, livre = document.documentElement.clientWidth - 16;
  if (larg <= livre) return;
  const k = livre / larg;
  f.classList.add('encolhida');
  f.style.transform = 'scale(' + k + ')';
  m.style.width = (larg * k) + 'px';
  m.style.height = (f.offsetHeight * k) + "px";
}
let _aj; window.addEventListener('resize', () => { clearTimeout(_aj); _aj = setTimeout(ajustar, 150); });

(async function () {
  const id = Number(new URLSearchParams(location.search).get('id'));
  const session = await FC.requireAuth();
  if (!session) return;
  if (!id) { $('conteudo').innerHTML = '<div class="estado">Recibo não encontrado.</div>'; return; }
  const { data: r, error } = await supabaseClient.rpc('dados_recibo', { pid: id });
  if (error || !r) {
    $('conteudo').innerHTML = '<div class="estado">' + (error ? esc(FC.traduzirErro(error)) : 'Este recibo não está disponível. Só existe recibo para pagamentos já confirmados.') + '</div>';
    return;
  }
  mostrar(r);
})();
</script>
</body>
</html>
