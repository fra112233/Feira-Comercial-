<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vídeos | Feira Comercial</title>
<link rel="icon" href="images/logo.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://bljnkwrhqnpawclybqrw.supabase.co">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
:root { --ouro:#f3c64e; --vermelho:#fe2c55; --txt:#fff; --sub:rgba(255,255,255,.75); --vidro:rgba(0,0,0,.45); }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; background:#000; color:var(--txt); font-family:Inter,'Segoe UI',system-ui,sans-serif; overflow:hidden; }
a { color:inherit; text-decoration:none; }

/* barra de cima */
.topo { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px; background:linear-gradient(rgba(0,0,0,.55),transparent); pointer-events:none; }
.topo > * { pointer-events:auto; }
.btn-ic { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--vidro); border:none; color:#fff; font-size:17px; cursor:pointer; }
.separadores { display:flex; gap:18px; font-weight:700; font-size:16px; }
.separadores button { background:none; border:none; color:var(--sub); font:inherit; cursor:pointer; padding:4px 0; border-bottom:2px solid transparent; }
.separadores button.ativo { color:#fff; border-color:#fff; }

/* feed vertical */
#feed { height:100%; overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; }
#feed::-webkit-scrollbar { display:none; }
.slide { position:relative; height:100%; width:100%; scroll-snap-align:start; scroll-snap-stop:always;
  display:flex; align-items:center; justify-content:center; background:#000; overflow:hidden; }
.slide video { height:100%; width:100%; max-width:min(100vw, calc(100vh * 9 / 16 + 120px)); object-fit:cover; background:#111; }
@media (min-width:700px) { .slide video { object-fit:contain; border-radius:12px; height:96%; } }

.pausa { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.pausa i { font-size:64px; color:rgba(255,255,255,.75); opacity:0; transform:scale(1.4); transition:.2s; }
.slide.parado .pausa i { opacity:1; transform:scale(1); }

.coracao-voa { position:absolute; font-size:90px; color:var(--vermelho); pointer-events:none; animation:voar .9s ease forwards; }
@keyframes voar { 0%{transform:scale(.3);opacity:0} 25%{transform:scale(1.15);opacity:1} 60%{transform:scale(1)} 100%{transform:translateY(-120px) scale(.8);opacity:0} }

/* ações à direita */
.acoes { position:absolute; right:10px; bottom:calc(110px + env(safe-area-inset-bottom)); display:flex; flex-direction:column;
  align-items:center; gap:20px; z-index:5; }
@media (min-width:700px) { .acoes { right:calc(50% - min(50vw, calc(48vh * 9 / 16 + 60px)) - 64px); } }
.acao { display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:#fff; cursor:pointer;
  font-size:12px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.6); }
.acao i { font-size:30px; filter:drop-shadow(0 1px 3px rgba(0,0,0,.5)); transition:transform .15s; }
.acao:active i { transform:scale(.85); }
.acao.gostei i { color:var(--vermelho); animation:pulsar .35s; }
@keyframes pulsar { 50% { transform:scale(1.3); } }
.autor-foto { position:relative; width:50px; height:50px; margin-bottom:6px; }
.autor-foto img { width:50px; height:50px; border-radius:50%; object-fit:cover; border:2px solid #fff; background:#333; }
.autor-foto .seguir { position:absolute; bottom:-9px; left:50%; transform:translateX(-50%); width:22px; height:22px; border-radius:50%;
  background:var(--vermelho); color:#fff; border:none; font-size:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; }

/* texto em baixo */
.info { position:absolute; left:14px; right:84px; bottom:calc(24px + env(safe-area-inset-bottom)); z-index:5; text-shadow:0 1px 3px rgba(0,0,0,.7); }
@media (min-width:700px) { .info { left:calc(50% - min(50vw, calc(48vh * 9 / 16)) + 14px); right:auto; max-width:min(80vw, calc(48vh * 9 / 8 - 90px)); } }
.info .nome { font-weight:800; font-size:16px; display:flex; align-items:center; gap:6px; }
.info .nome .selo { font-size:11px; background:var(--ouro); color:#000; padding:1px 7px; border-radius:10px; text-shadow:none; }
.info .legenda { margin-top:6px; font-size:14px; line-height:1.4; max-height:4.2em; overflow:hidden; }
.info .legenda.aberta { max-height:none; }
.info .meta { margin-top:6px; font-size:12px; color:var(--sub); }

.vazio { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:30px; color:var(--sub); }
.vazio i { font-size:56px; color:var(--ouro); }
.btn-ouro { background:var(--ouro); color:#000; border:none; border-radius:30px; padding:12px 24px; font-weight:800; font-size:15px; cursor:pointer; }
.btn-ouro:disabled { opacity:.5; }

/* folhas (comentários, publicar) */
.fundo { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40; opacity:0; visibility:hidden; transition:.25s; }
.fundo.aberto { opacity:1; visibility:visible; }
.folha { position:fixed; left:0; right:0; bottom:0; z-index:41; max-width:560px; margin:0 auto; background:#161616; border-radius:16px 16px 0 0;
  transform:translateY(100%); transition:transform .3s ease; max-height:78vh; display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom); }
.folha.aberta { transform:none; }
.folha-cab { padding:14px 16px; text-align:center; font-weight:700; border-bottom:1px solid #2a2a2a; position:relative; }
.folha-cab button { position:absolute; right:12px; top:8px; background:none; border:none; color:#fff; font-size:22px; cursor:pointer; }
.lista-com { flex:1; overflow-y:auto; padding:8px 16px; min-height:180px; }
.com { display:flex; gap:10px; padding:10px 0; }
.com img { width:34px; height:34px; border-radius:50%; object-fit:cover; flex-shrink:0; background:#333; }
.com .t { font-size:14px; line-height:1.4; } .com .n { font-size:12px; color:#aaa; font-weight:700; margin-bottom:2px; }
.com .q { font-size:11px; color:#777; margin-top:3px; } .com .q button { background:none; border:none; color:#aaa; cursor:pointer; font-size:11px; margin-left:8px; }
.escrever { display:flex; gap:8px; padding:10px 12px; border-top:1px solid #2a2a2a; }
.escrever input { flex:1; background:#262626; border:none; border-radius:20px; padding:11px 16px; color:#fff; font-size:14px; outline:none; }
.escrever button { background:none; border:none; color:var(--vermelho); font-size:20px; cursor:pointer; padding:0 6px; }

.publicar { padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
.escolher { border:2px dashed #444; border-radius:12px; padding:26px; text-align:center; color:#aaa; cursor:pointer; }
.escolher i { font-size:36px; color:var(--ouro); display:block; margin-bottom:8px; }
.previa { width:100%; max-height:42vh; border-radius:12px; background:#000; display:none; }
.publicar textarea { background:#262626; border:none; border-radius:10px; padding:12px; color:#fff; font:inherit; font-size:14px; min-height:70px; resize:vertical; outline:none; }
.aviso { font-size:12px; color:#999; }
.progresso { height:4px; background:#333; border-radius:4px; overflow:hidden; display:none; }
.progresso i { display:block; height:100%; width:30%; background:var(--ouro); animation:carregar 1s ease-in-out infinite; }
@keyframes carregar { from{transform:translateX(-100%)} to{transform:translateX(400%)} }

#toast { position:fixed; left:50%; top:80px; transform:translateX(-50%); background:rgba(30,30,30,.95); color:#fff; padding:10px 18px;
  border-radius:20px; font-size:14px; z-index:60; opacity:0; transition:.25s; pointer-events:none; }
#toast.ver { opacity:1; }
</style>
</head>
<body>

<header class="topo">
  <a class="btn-ic" href="index.html" title="Voltar"><i class="fas fa-arrow-left"></i></a>
  <div class="separadores">
    <button id="sep-seguir" onclick="mudarSeparador('seguir')">A seguir</button>
    <button id="sep-todos" class="ativo" onclick="mudarSeparador('todos')">Para ti</button>
  </div>
  <button class="btn-ic" onclick="abrirPublicar()" title="Publicar vídeo"><i class="fas fa-plus"></i></button>
</header>

<main id="feed"></main>

<!-- comentários -->
<div class="fundo" id="fundo" onclick="fecharFolhas()"></div>
<section class="folha" id="folhaCom">
  <div class="folha-cab"><span id="comTitulo">Comentários</span><button onclick="fecharFolhas()">&times;</button></div>
  <div class="lista-com" id="listaCom"></div>
  <form class="escrever" onsubmit="enviarComentario(event)">
    <input id="novoCom" placeholder="Adicionar comentário..." maxlength="1000" autocomplete="off">
    <button type="submit"><i class="fas fa-paper-plane"></i></button>
  </form>
</section>

<!-- publicar vídeo -->
<section class="folha" id="folhaPub">
  <div class="folha-cab">Publicar vídeo<button onclick="fecharFolhas()">&times;</button></div>
  <div class="publicar">
    <label class="escolher" id="escolher">
      <i class="fas fa-video"></i>
      Escolher ou gravar vídeo<br><span class="aviso">Vertical de preferência · até 3 minutos · até 50 MB</span>
      <input type="file" id="ficheiroVideo" accept="video/*" hidden onchange="escolherVideo(event)">
    </label>
    <video class="previa" id="previa" controls playsinline></video>
    <textarea id="legenda" maxlength="500" placeholder="Escreve uma legenda... #promoção #maputo"></textarea>
    <div class="progresso" id="progresso"><i></i></div>
    <button class="btn-ouro" id="btnPublicar" onclick="publicarVideo()" disabled>Publicar</button>
  </div>
</section>

<div id="toast"></div>

<script>
const LOTE = 8;
let me = null;
let separador = 'todos';
let videos = [];
let fim = false, aCarregar = false;
let seguindo = new Set();
let gostos = new Set();          // vídeos de que gostei
let somLigado = false;
let videoComentarios = null;
let ficheiro = null, duracao = null;
const vistos = new Set();

const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const avatar = p => (p && p.avatar_url) || ('https://ui-avatars.com/api/?name=' + encodeURIComponent((p && p.full_name) || 'U') + '&background=random&color=fff&size=128');
const numero = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + ' M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace('.0', '') + ' mil' : String(n || 0);
function haQuanto(ts) {
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 60) return 'agora'; if (s < 3600) return Math.floor(s / 60) + ' min';
  if (s < 86400) return Math.floor(s / 3600) + ' h'; if (s < 604800) return Math.floor(s / 86400) + ' d';
  return new Date(ts).toLocaleDateString('pt-PT');
}
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('ver'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('ver'), 2200); }

// ─── ARRANQUE ───
(async function () {
  me = await FC.boot();
  if (!me) return;
  const { data } = await supabaseClient.from('followers').select('following_id').eq('follower_id', me.id);
  seguindo = new Set((data || []).map(r => r.following_id));
  const v = new URLSearchParams(location.search).get('v');
  await carregarMais(v ? Number(v) : null);
})();

async function carregarMais(primeiroId) {
  if (aCarregar || fim) return;
  aCarregar = true;
  let q = supabaseClient.from('videos')
    .select('id, video_url, caption, views, likes_count, comments_count, created_at, user_id, autor:perfis!videos_user_id_fkey(id, full_name, avatar_url, type)')
    .order('created_at', { ascending: false })
    .range(videos.length, videos.length + LOTE - 1);
  if (separador === 'seguir') {
    if (!seguindo.size) { aCarregar = false; fim = true; desenharVazio(); return; }
    q = q.in('user_id', [...seguindo]);
  }
  const { data, error } = await q;
  aCarregar = false;
  if (error) { toast('Erro ao carregar vídeos'); console.error(error.message); return; }
  let novos = data || [];
  if (novos.length < LOTE) fim = true;

  // vídeo partilhado por link (?v=...) aparece primeiro
  if (primeiroId) {
    const { data: um } = await supabaseClient.from('videos')
      .select('id, video_url, caption, views, likes_count, comments_count, created_at, user_id, autor:perfis!videos_user_id_fkey(id, full_name, avatar_url, type)')
      .eq('id', primeiroId).maybeSingle();
    if (um) novos = [um, ...novos.filter(x => x.id !== um.id)];
  }

  if (novos.length) {
    const { data: lk } = await supabaseClient.from('video_likes').select('video_id').eq('user_id', me.id).in('video_id', novos.map(x => x.id));
    (lk || []).forEach(r => gostos.add(r.video_id));
  }
  const feed = document.getElementById('feed');
  if (!videos.length && !novos.length) { desenharVazio(); return; }
  novos.forEach(v => { videos.push(v); feed.appendChild(criarSlide(v)); });
}

function desenharVazio() {
  document.getElementById('feed').innerHTML = `
    <div class="vazio"><i class="fas fa-clapperboard"></i>
      <b style="color:#fff;font-size:18px;">${separador === 'seguir' ? 'Ainda não há vídeos de quem segues' : 'Ainda não há vídeos'}</b>
      <span>${separador === 'seguir' ? 'Segue pessoas e empresas em Amigos, ou vê "Para ti".' : 'Sê o primeiro a mostrar o teu negócio em vídeo!'}</span>
      <button class="btn-ouro" onclick="abrirPublicar()"><i class="fas fa-plus"></i> Publicar vídeo</button></div>`;
}

function mudarSeparador(s) {
  if (s === separador) return;
  separador = s;
  document.getElementById('sep-todos').classList.toggle('ativo', s === 'todos');
  document.getElementById('sep-seguir').classList.toggle('ativo', s === 'seguir');
  videos = []; fim = false;
  document.getElementById('feed').innerHTML = '';
  document.getElementById('feed').scrollTop = 0;
  carregarMais();
}

// ─── CADA VÍDEO ───
function criarSlide(v) {
  const a = v.autor || {};
  const meu = v.user_id === me.id;
  const div = document.createElement('section');
  div.className = 'slide';
  div.dataset.id = v.id;
  div.innerHTML = `
    <video src="${esc(v.video_url)}" loop playsinline preload="metadata" ${somLigado ? '' : 'muted'}></video>
    <div class="pausa"><i class="fas fa-play"></i></div>
    <div class="acoes">
      <div class="autor-foto">
        <a href="${meu ? 'perfil.html' : 'perfil.html?id=' + a.id}"><img src="${esc(avatar(a))}" alt=""></a>
        ${!meu && !seguindo.has(v.user_id) ? `<button class="seguir" onclick="seguir('${v.user_id}', this)" title="Seguir"><i class="fas fa-plus"></i></button>` : ''}
      </div>
      <button class="acao ${gostos.has(v.id) ? 'gostei' : ''}" data-gosto onclick="alternarGosto(${v.id})"><i class="fas fa-heart"></i><span>${numero(v.likes_count)}</span></button>
      <button class="acao" onclick="abrirComentarios(${v.id})"><i class="fas fa-comment-dots"></i><span data-ncom>${numero(v.comments_count)}</span></button>
      <button class="acao" onclick="partilhar(${v.id})"><i class="fas fa-share"></i><span>Partilhar</span></button>
      <button class="acao" data-som onclick="alternarSom()"><i class="fas ${somLigado ? 'fa-volume-high' : 'fa-volume-xmark'}"></i><span>Som</span></button>
      ${meu ? `<button class="acao" onclick="apagarVideo(${v.id})"><i class="fas fa-trash"></i><span>Apagar</span></button>` : ''}
    </div>
    <div class="info">
      <a class="nome" href="${meu ? 'perfil.html' : 'perfil.html?id=' + a.id}">@${esc(a.full_name || 'utilizador')}
        ${a.type === 'empresa' ? '<span class="selo"><i class="fas fa-building"></i> Empresa</span>' : ''}</a>
      ${v.caption ? `<div class="legenda" onclick="this.classList.toggle('aberta')">${esc(v.caption)}</div>` : ''}
      <div class="meta"><i class="fas fa-play"></i> ${numero(v.views)} · ${haQuanto(v.created_at)}
        ${!meu ? ` · <a href="mensagen.html?para=${a.id}" style="text-decoration:underline;">Enviar mensagem</a>` : ''}</div>
    </div>`;

  const video = div.querySelector('video');
  let ultimoToque = 0;
  video.addEventListener('click', e => {
    const agora = Date.now();
    if (agora - ultimoToque < 300) {          // toque duplo = gosto
      if (!gostos.has(v.id)) alternarGosto(v.id);
      coracao(div, e);
      clearTimeout(video._t);
    } else {
      video._t = setTimeout(() => {           // toque simples = pausa / continua
        if (video.paused) { video.play().catch(() => {}); div.classList.remove('parado'); }
        else { video.pause(); div.classList.add('parado'); }
      }, 260);
    }
    ultimoToque = agora;
  });
  observador.observe(div);
  return div;
}

function coracao(slide, e) {
  const h = document.createElement('i');
  h.className = 'fas fa-heart coracao-voa';
  const r = slide.getBoundingClientRect();
  h.style.left = (e.clientX - r.left - 45) + 'px';
  h.style.top = (e.clientY - r.top - 45) + 'px';
  slide.appendChild(h);
  setTimeout(() => h.remove(), 900);
}

// só toca o vídeo que está no ecrã; conta a visualização depois de 2 s
const observador = new IntersectionObserver(entradas => {
  entradas.forEach(en => {
    const slide = en.target, video = slide.querySelector('video');
    if (en.isIntersecting && en.intersectionRatio > 0.6) {
      video.muted = !somLigado;
      video.currentTime = video.currentTime || 0;
      video.play().catch(() => { slide.classList.add('parado'); });
      slide.classList.remove('parado');
      const id = Number(slide.dataset.id);
      clearTimeout(slide._vista);
      slide._vista = setTimeout(() => {
        if (!vistos.has(id)) { vistos.add(id); supabaseClient.rpc('ver_video', { vid: id }); }
      }, 2000);
      // pré-carregar o seguinte e pedir mais vídeos perto do fim
      const seg = slide.nextElementSibling; if (seg && seg.querySelector('video')) seg.querySelector('video').preload = 'auto';
      if (videos.length - [...slide.parentNode.children].indexOf(slide) <= 3) carregarMais();
    } else {
      video.pause();
      clearTimeout(slide._vista);
    }
  });
}, { threshold: [0, 0.6, 1] });

function alternarSom() {
  somLigado = !somLigado;
  document.querySelectorAll('.slide video').forEach(v => v.muted = !somLigado);
  document.querySelectorAll('[data-som] i').forEach(i => i.className = 'fas ' + (somLigado ? 'fa-volume-high' : 'fa-volume-xmark'));
  toast(somLigado ? 'Som ligado' : 'Som desligado');
}

function slideDe(id) { return document.querySelector(`.slide[data-id="${id}"]`); }

async function alternarGosto(id) {
  const v = videos.find(x => x.id === id); if (!v) return;
  const btn = slideDe(id).querySelector('[data-gosto]');
  const tinha = gostos.has(id);
  // muda logo no ecrã, desfaz se falhar
  if (tinha) { gostos.delete(id); v.likes_count--; } else { gostos.add(id); v.likes_count++; }
  btn.classList.toggle('gostei', !tinha); btn.querySelector('span').textContent = numero(v.likes_count);
  const { error } = tinha
    ? await supabaseClient.from('video_likes').delete().eq('video_id', id).eq('user_id', me.id)
    : await supabaseClient.from('video_likes').insert({ video_id: id, user_id: me.id });
  if (error && !String(error.message).includes('duplicate')) {
    if (tinha) { gostos.add(id); v.likes_count++; } else { gostos.delete(id); v.likes_count--; }
    btn.classList.toggle('gostei', tinha); btn.querySelector('span').textContent = numero(v.likes_count);
    toast('Erro: ' + error.message);
  }
}

async function seguir(uid, btn) {
  btn.disabled = true;
  const { error } = await supabaseClient.from('followers').insert({ follower_id: me.id, following_id: uid, created_at: Date.now() });
  if (error && !String(error.message).includes('duplicate')) { btn.disabled = false; toast('Erro: ' + error.message); return; }
  seguindo.add(uid);
  document.querySelectorAll('.slide').forEach(s => {
    const v = videos.find(x => x.id === Number(s.dataset.id));
    if (v && v.user_id === uid) { const b = s.querySelector('.seguir'); if (b) b.remove(); }
  });
  toast('Agora segues esta conta');
}

async function partilhar(id) {
  const url = location.origin + location.pathname + '?v=' + id;
  const v = videos.find(x => x.id === id);
  try {
    if (navigator.share) await navigator.share({ title: 'Feira Comercial', text: v && v.caption ? v.caption : 'Vê este vídeo', url });
    else { await navigator.clipboard.writeText(url); toast('Link copiado!'); }
  } catch (e) {}
}

async function apagarVideo(id) {
  if (!confirm('Apagar este vídeo?')) return;
  const v = videos.find(x => x.id === id);
  const { error } = await supabaseClient.from('videos').delete().eq('id', id);
  if (error) { toast('Erro: ' + error.message); return; }
  const caminho = v && v.video_url.split('/storage/v1/object/public/videos/')[1];
  if (caminho) supabaseClient.storage.from('videos').remove([caminho]);
  videos = videos.filter(x => x.id !== id);
  const s = slideDe(id); if (s) s.remove();
  if (!videos.length) desenharVazio();
  toast('Vídeo apagado');
}

// ─── COMENTÁRIOS ───
function abrirFolha(id) {
  document.getElementById('fundo').classList.add('aberto');
  document.getElementById(id).classList.add('aberta');
}
function fecharFolhas() {
  document.getElementById('fundo').classList.remove('aberto');
  document.querySelectorAll('.folha').forEach(f => f.classList.remove('aberta'));
  videoComentarios = null;
}

async function abrirComentarios(id) {
  videoComentarios = id;
  abrirFolha('folhaCom');
  await carregarComentarios();
}

async function carregarComentarios() {
  const id = videoComentarios; if (!id) return;
  const lista = document.getElementById('listaCom');
  lista.innerHTML = '<p style="text-align:center;color:#777;padding:20px;">A carregar...</p>';
  const { data, error } = await supabaseClient.from('video_comments')
    .select('id, content, created_at, user_id, autor:perfis!video_comments_user_id_fkey(full_name, avatar_url)')
    .eq('video_id', id).order('created_at', { ascending: true }).limit(200);
  if (id !== videoComentarios) return;
  if (error) { lista.innerHTML = '<p style="text-align:center;color:#777;padding:20px;">Erro ao carregar</p>'; return; }
  const v = videos.find(x => x.id === id);
  document.getElementById('comTitulo').textContent = (data || []).length + ' comentário' + ((data || []).length === 1 ? '' : 's');
  lista.innerHTML = (data || []).map(c => `
    <div class="com">
      <img src="${esc(avatar(c.autor))}" alt="">
      <div><div class="n">${esc((c.autor && c.autor.full_name) || 'Utilizador')}</div>
        <div class="t">${esc(c.content)}</div>
        <div class="q">${haQuanto(c.created_at)}${(c.user_id === me.id || (v && v.user_id === me.id)) ? `<button onclick="apagarComentario(${c.id})">Apagar</button>` : ''}</div></div>
    </div>`).join('') || '<p style="text-align:center;color:#777;padding:30px;">Sê o primeiro a comentar.</p>';
  lista.scrollTop = lista.scrollHeight;
  if (v) { v.comments_count = (data || []).length; const s = slideDe(id); if (s) s.querySelector('[data-ncom]').textContent = numero(v.comments_count); }
}

async function enviarComentario(e) {
  e.preventDefault();
  const inp = document.getElementById('novoCom');
  const texto = inp.value.trim();
  if (!texto || !videoComentarios) return;
  inp.value = '';
  const { error } = await supabaseClient.from('video_comments').insert({ video_id: videoComentarios, user_id: me.id, content: texto });
  if (error) { inp.value = texto; toast('Erro: ' + error.message); return; }
  carregarComentarios();
}

async function apagarComentario(cid) {
  if (!confirm('Apagar este comentário?')) return;
  const { error } = await supabaseClient.from('video_comments').delete().eq('id', cid);
  if (error) { toast('Erro: ' + error.message); return; }
  carregarComentarios();
}

// ─── PUBLICAR ───
function abrirPublicar() { abrirFolha('folhaPub'); }

function escolherVideo(e) {
  const f = e.target.files[0];
  if (!f) return;
  if (!f.type.startsWith('video/')) { toast('Escolhe um ficheiro de vídeo.'); return; }
  if (f.size > 50 * 1024 * 1024) { toast('O vídeo tem mais de 50 MB. Grava um vídeo mais curto.'); e.target.value = ''; return; }
  const prev = document.getElementById('previa');
  prev.src = URL.createObjectURL(f);
  prev.style.display = 'block';
  prev.onloadedmetadata = () => {
    duracao = prev.duration;
    if (duracao > 180) { toast('O vídeo tem mais de 3 minutos.'); ficheiro = null; document.getElementById('btnPublicar').disabled = true; return; }
    ficheiro = f;
    document.getElementById('btnPublicar').disabled = false;
  };
  document.getElementById('escolher').style.display = 'none';
}

async function publicarVideo() {
  if (!ficheiro) return;
  const btn = document.getElementById('btnPublicar');
  btn.disabled = true; btn.textContent = 'A enviar vídeo...';
  document.getElementById('progresso').style.display = 'block';
  try {
    const ext = (ficheiro.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp4';
    const caminho = `${me.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const { error: e1 } = await supabaseClient.storage.from('videos').upload(caminho, ficheiro, { contentType: ficheiro.type || 'video/mp4' });
    if (e1) throw e1;
    const url = supabaseClient.storage.from('videos').getPublicUrl(caminho).data.publicUrl;
    const { error: e2 } = await supabaseClient.from('videos').insert({
      user_id: me.id, video_url: url, caption: document.getElementById('legenda').value.trim() || null,
      duracao: duracao ? Math.round(duracao) : null
    });
    if (e2) throw e2;
    toast('Vídeo publicado! 🎉');
    // limpar o formulário e mostrar o vídeo no topo
    ficheiro = null; duracao = null;
    document.getElementById('legenda').value = '';
    document.getElementById('ficheiroVideo').value = '';
    document.getElementById('previa').style.display = 'none';
    document.getElementById('escolher').style.display = '';
    fecharFolhas();
    separador = ''; mudarSeparador('todos');
  } catch (err) {
    toast('Erro ao publicar: ' + err.message);
  } finally {
    btn.textContent = 'Publicar';
    btn.disabled = !ficheiro;
    document.getElementById('progresso').style.display = 'none';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fecharFolhas();
  if (document.querySelector('.folha.aberta') || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const feed = document.getElementById('feed');
  if (e.key === 'ArrowDown') { e.preventDefault(); feed.scrollBy({ top: feed.clientHeight, behavior: 'smooth' }); }
  if (e.key === 'ArrowUp') { e.preventDefault(); feed.scrollBy({ top: -feed.clientHeight, behavior: 'smooth' }); }
  if (e.key.toLowerCase() === 'm') alternarSom();
});
</script>
